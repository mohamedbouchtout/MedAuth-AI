# MedAuth AI — full local stack.
#
#   docker compose up
#
# This brings up the four backing services only. Application services run on the
# host via `uv run uvicorn ...` (see CLAUDE.md for the port map).
#
# Local dev only: these credentials are throwaway and no PHI belongs in them.
# Deployed environments use RDS / ElastiCache / EKS with secrets from AWS
# Secrets Manager.

services:
  postgres:
    image: postgres:16-alpine
    container_name: medauth-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medauth}
      POSTGRES_USER: ${POSTGRES_USER:-medauth}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-medauth_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Creates the separate `hapi` database the HAPI FHIR server needs.
      - ./infrastructure/postgres/init-hapi-db.sql:/docker-entrypoint-initdb.d/10-init-hapi-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medauth} -d ${POSTGRES_DB:-medauth}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: medauth-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    container_name: medauth-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Synthetic EHR for local development. Load synthetic patients with
  # ./scripts/seed-synthea.sh — never point this at real patient data.
  hapi-fhir:
    image: hapiproject/hapi:latest
    container_name: medauth-hapi-fhir
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${HAPI_DB:-hapi}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-medauth}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-medauth_local_dev}
      SPRING_DATASOURCE_DRIVERCLASSNAME: org.postgresql.Driver
      SPRING_JPA_PROPERTIES_HIBERNATE_DIALECT: ca.uhn.fhir.jpa.model.dialect.HapiFhirPostgres94Dialect
      HAPI_FHIR_FHIR_VERSION: R4
      HAPI_FHIR_ALLOW_MULTIPLE_DELETE: "true"
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
  qdrant-data:
