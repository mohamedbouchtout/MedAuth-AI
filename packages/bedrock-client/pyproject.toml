[project]
name = "medauth-bedrock-client"
version = "0.1.0"
description = "Shared AWS Bedrock access — client construction and reading what came back. See TASK-030."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.43.77",
    "langchain-aws>=0.2",
    "langchain-core>=0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bedrock_client"]
