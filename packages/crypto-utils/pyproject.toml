[project]
name = "medauth-crypto-utils"
version = "0.1.0"
description = "AES-256-GCM field encryption with a KMS-backed KEK. See TASK-003."
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35",
    "cryptography>=43.0",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/crypto_utils"]
