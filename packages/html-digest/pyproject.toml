[project]
name = "medauth-html-digest"
version = "0.1.0"
description = "Which bytes of an HTML policy document are script or style, and the digest taken without them. Shared by every site that hashes or reads HTML. See TASK-009."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/html_digest"]
