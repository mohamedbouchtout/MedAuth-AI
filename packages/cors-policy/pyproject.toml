[project]
name = "medauth-cors-policy"
version = "0.1.0"
description = "The repository's one CORS policy, installed per service. See TASK-041c."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic-settings>=2.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cors_policy"]
