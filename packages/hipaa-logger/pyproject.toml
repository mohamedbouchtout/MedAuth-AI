[project]
name = "medauth-hipaa-logger"
version = "0.1.0"
description = "Shared HIPAA audit logging — every service imports this. See TASK-002."
requires-python = ">=3.12"
dependencies = [
    # alembic + sqlalchemy are migration-time only. Runtime is raw asyncpg by design
    # — see "packages/hipaa-logger — Design Decisions" in CLAUDE.md.
    "alembic>=1.14",
    "asyncpg>=0.30",
    "pydantic>=2.13.5",
    "sqlalchemy[asyncio]>=2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hipaa_logger"]
