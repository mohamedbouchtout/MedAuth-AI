[project]
name = "medauth-hipaa-logger"
version = "0.1.0"
description = "Shared HIPAA audit logging — every service imports this. See TASK-002."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "pydantic>=2.9",
    "sqlalchemy[asyncio]>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hipaa_logger"]
