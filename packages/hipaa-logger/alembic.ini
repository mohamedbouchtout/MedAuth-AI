# Alembic configuration for packages/hipaa-logger.
#
# This package owns the audit_log table and nothing else. Its migration is applied
# before any service-owned migration in a fresh environment.
#
#   cd packages/hipaa-logger && uv run alembic upgrade head
#
# The database URL is not stored here — env.py reads DATABASE_URL so one value
# serves every consumer in the monorepo.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
