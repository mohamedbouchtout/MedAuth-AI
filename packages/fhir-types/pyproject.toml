[project]
name = "medauth-fhir-types"
version = "0.1.0"
description = "Pydantic v2 models for the FHIR R4 resources this project uses. See TASK-004."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fhir_types"]
