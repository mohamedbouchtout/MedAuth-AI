[project]
name = "medauth-payer-vocab"
version = "0.1.0"
description = "Canonical payer slugs and jurisdiction state codes shared by every service that stores, matches or caches on a payer. See TASK-016."
requires-python = ">=3.12"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/payer_vocab"]
