[project]
name = "medauth-session-auth"
version = "0.1.0"
description = "Shared session-token validation for real-time endpoints. Validates, never mints. See TASK-041."
requires-python = ">=3.12"
dependencies = [
    "pyjwt>=2.13.0",
]

[dependency-groups]
dev = [
    # Test-only, and only for tests/unit/test_issuer_contract.py: this package
    # validates the tokens track-a-clinical mints, and that file proves the two
    # agree by calling the real issuer rather than hand-rolling a token that
    # merely looks like one. Deliberately NOT a runtime dependency — nothing in
    # src/ imports track_a_clinical, and nothing should: this package must not
    # depend on the service whose tokens it checks.
    "medauth-track-a-clinical",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/session_auth"]
