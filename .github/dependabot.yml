# Dependabot configuration — lives at .github/dependabot.yml (NOT under workflows/).
#
# Security patches matter more than usual here: this codebase handles PHI, so a
# vulnerable transitive dependency is a HIPAA exposure, not just a bug. Grouped
# minor/patch updates keep the PR volume low; majors come through one at a time
# so they get a real review.

version: 2

updates:
  # -------------------------------------------------------------------------
  # Python — one uv workspace at the repo root covers all services/ and packages/
  # -------------------------------------------------------------------------
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "America/New_York"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      python-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Majors of the core data/LLM stack land as separate, reviewed PRs.
      - dependency-name: "pydantic"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sqlalchemy"
        update-types: ["version-update:semver-major"]
      - dependency-name: "langchain*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "sentence-transformers*"
        update-types: ["version-update:semver-major"]

  # -------------------------------------------------------------------------
  # JavaScript — frontends only (all backend services are Python)
  # -------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "frontend"
    commit-message:
      prefix: "chore(deps)"
    groups:
      web-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "npm"
    directory: "/apps/mobile"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "mobile"
    commit-message:
      prefix: "chore(deps)"
    groups:
      mobile-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
    ignore:
      # Expo SDK upgrades are coordinated migrations — never automatic.
      - dependency-name: "expo"
      - dependency-name: "react-native"

  # -------------------------------------------------------------------------
  # GitHub Actions — keeps the pinned action versions in workflows/ current
  # -------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions:
        patterns:
          - "*"

  # -------------------------------------------------------------------------
  # Docker — the local stack images (postgres, redis, qdrant, hapi-fhir).
  #
  # This also covers CI: the test job brings these services up from
  # docker-compose.yml rather than declaring its own service containers, so a
  # bump here updates both at once and the two cannot drift. That arrangement
  # exists because Dependabot cannot watch images declared as GitHub Actions
  # service containers (dependabot-core#5819) — when CI had its own pin, a
  # bump to this file alone put local dev on postgres 18 while CI ran 16.
  # -------------------------------------------------------------------------
  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
      - "docker"
    commit-message:
      prefix: "chore(deps)"
    ignore:
      # A postgres major is a data migration, not a bump. 18 moved the data
      # directory to a major-version subdirectory, which breaks every existing
      # local volume against the mount in docker-compose.yml — and CI would not
      # catch it, because CI starts from an empty volume every run and stays
      # green. Upgrading means moving the mount and planning a pg_upgrade, so
      # it starts as a deliberate change rather than an automated PR.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]

  # Terraform is not enabled yet — infrastructure/terraform has no .tf files.
  # Add this block with TASK-0xx when the AWS infrastructure lands:
  # - package-ecosystem: "terraform"
  #   directory: "/infrastructure/terraform"
  #   schedule:
  #     interval: "weekly"
