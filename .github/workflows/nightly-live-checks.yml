name: Nightly live checks

# Runs the tests that talk to real external sources, with their gate turned on.
#
# Those tests are skipped by default so an unrelated pull request never goes red
# because a government site was slow or a vendor sandbox was being rebuilt. But a
# gate nobody ever opens is not a deferral, it is a deletion: drift in the
# upstream source would then be discovered whenever someone happened to set the
# flag, which is no better than loosening the assertions until they stop failing.
# This workflow is what makes the gate honest.
#
# A failure here is a real signal about the outside world, not a flake to re-run
# until green. Fix the scraper or the fixtures; do not relax the assertion.
#
# Currently: the CMS Medicare Coverage Database (TASK-013), the commercial
# payer documents the dev corpus is seeded from (TASK-014), the HL7 Da Vinci
# CRD Reference Implementation (TASK-015), and the Athenahealth sandbox
# (TASK-052). EHR sandboxes join this workflow as their tasks land — each one as
# its own job, so a red nightly names the upstream that moved without anyone
# opening the log.

on:
  schedule:
    # 05:00 UTC. After the policy scraper's own 03:30 CronJob slot, and well
    # after CMS regenerates its exports at about 02:00 UTC — checking while the
    # archives are being rewritten would produce failures about our timing
    # rather than about their structure.
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  cms-coverage-database:
    name: CMS Medicare Coverage Database
    runs-on: ubuntu-latest
    env:
      # The gate the tests check. Without it they skip, exactly as they do on a
      # pull request.
      RUN_CMS_LIVE_TESTS: "1"
      # cms.gov answers 403 to some clients on User-Agent alone, and the config
      # refuses to start without a contact address in it.
      POLICY_SCRAPER_USER_AGENT: "MedAuthAI-PolicyScraper/0.1 (+https://github.com/mohamedbouchtout/MedAuth-AI; mohamedbouchtout@gmail.com)"
      DATABASE_URL: postgresql+asyncpg://medauth:medauth_ci@localhost:5432/medauth_test

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # Same stack, same images, same healthchecks as CI and as a laptop —
      # docker-compose.yml is the single place backing service versions are
      # written. See CLAUDE.md, "Backing service versions live in exactly one
      # file".
      - name: Start backing services
        env:
          POSTGRES_DB: medauth_test
          POSTGRES_PASSWORD: medauth_ci
        run: docker compose up -d --wait postgres

      - run: uv sync --all-packages

      - name: Apply migrations
        run: ./scripts/init-db.sh

      # Only the live checks. The rest of the suite already ran on the pull
      # request that introduced it, and re-running it here would bury a real
      # CMS failure in a hundred lines of unrelated passes.
      - name: Live CMS export checks
        working-directory: services/policy-scraper
        run: uv run pytest tests/integration/test_cms_live.py -v --no-cov

  davinci-crd:
    name: HL7 Da Vinci CRD Reference Implementation
    runs-on: ubuntu-latest
    env:
      # The gate tests/integration/test_crd_live.py checks. Off everywhere else,
      # so pytest on a laptop and pytest on a pull request agree.
      RUN_CRD_LIVE_TESTS: "1"
      CRD_BASE_URL: http://localhost:8006

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # From docker-compose.yml, like every other backing service — see
      # CLAUDE.md, "Backing service versions live in exactly one file". The
      # image carries the CDS-Library rule sets, so there is nothing to load.
      # `--wait` honours the compose healthcheck, whose start_period allows for
      # the RI compiling its CQL libraries before it listens.
      - name: Start the CRD Reference Implementation
        run: docker compose up -d --wait crd

      - run: uv sync --all-packages

      # The unit tests already ran on the pull request that introduced them,
      # against fixtures captured from this same server. What this adds is
      # whether those fixtures still describe it. A failure means the RI moved:
      # re-capture tests/fixtures/crd/ and fix the mapping. Do not relax the
      # assertions to make it pass.
      - name: Live CRD Reference Implementation checks
        working-directory: services/track-b-rag
        run: uv run pytest tests/integration/test_crd_live.py -v --no-cov

      - name: CRD server log on failure
        if: failure()
        run: docker compose logs crd

  commercial-payer-policies:
    name: Aetna and BCBSMA policy documents
    runs-on: ubuntu-latest
    env:
      # The gate scripts/seed-policies.py's live checks read. Off everywhere
      # else, so pytest on a laptop and pytest on a pull request agree.
      RUN_PAYER_LIVE_TESTS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - run: uv sync --all-packages

      # These fetch from the payers and assert each URL still resolves to a
      # document of the type SEED_POLICIES declares. They need no database and
      # no Qdrant: nothing is ingested here, the point is only whether the
      # curated URLs still point at what they claim to.
      #
      # A failure means a payer moved, renamed or withdrew a policy. Fix the
      # entry in SEED_POLICIES; do not widen the assertion to make it pass.
      - name: Live Aetna and BCBSMA document checks
        working-directory: services/track-b-rag
        run: uv run pytest tests/integration/test_seed_policies.py -v -k Live --no-cov

  athenahealth-sandbox:
    name: Athenahealth sandbox FHIR reads and note write-back
    runs-on: ubuntu-latest
    env:
      # The gate the sandbox tests read. Off everywhere else, so pytest on a
      # laptop and pytest on a pull request agree.
      RUN_ATHENA_LIVE_TESTS: "1"
      ATHENA_CLIENT_ID: ${{ secrets.ATHENA_CLIENT_ID }}
      ATHENA_CLIENT_SECRET: ${{ secrets.ATHENA_CLIENT_SECRET }}
      ATHENA_FHIR_BASE_URL: ${{ vars.ATHENA_FHIR_BASE_URL }}
      ATHENA_TEST_PATIENT_ID: ${{ vars.ATHENA_TEST_PATIENT_ID }}
      # TASK-053 files a note against a real encounter. Unset until a sandbox
      # encounter exists, and the write test fails naming it rather than
      # inventing an encounter id and filing a note against nothing.
      ATHENA_TEST_ENCOUNTER_ID: ${{ vars.ATHENA_TEST_ENCOUNTER_ID }}

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - run: uv sync --all-packages

      # KNOWN BLOCKER, and this job is expected to be red or skipped until it is
      # cleared: it has never been established that working Athenahealth sandbox
      # credentials exist, that SMART_REDIRECT_URI is registered against them, or
      # that the developer-program access level (Development versus Preview) is
      # the one that grants FHIR reads. Nothing in this repository evidences a
      # successful launch against Athena.
      #
      # The job is committed anyway rather than held back, because a gated test
      # with no scheduled run is a deleted test — and because the first real run
      # is what will actually answer the access question. If it fails, read the
      # failure as "our sandbox access is not set up" before reading it as "the
      # adapter is wrong". TASK-055 is where Athena is genuinely validated;
      # TASK-052 must not be closed on the strength of this job passing.
      - name: Live Athenahealth sandbox reads
        working-directory: services/fhir-integration
        run: uv run pytest tests/integration/test_athena_sandbox.py -v --no-cov
