name: CI

# Runs on every PR into main, and on main itself after merge.
#
# Shape: a `changes` job works out which workspace members a PR actually touches,
# then lint / type-check / test fan out over just those. Members are full paths —
# `services/track-b-rag`, `packages/hipaa-logger` — so packages get their own test
# jobs rather than only triggering service ones. A change under packages/ also
# re-tests every service, since every service imports the shared packages.
#
# Nothing here talks to AWS. Bedrock, Transcribe Medical, Comprehend Medical and
# KMS are all mocked with moto — no real credentials belong in CI.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, never a run on main. Merges can arrive faster than
  # CI completes, and cancelling then leaves commits on main with no verdict at
  # all — which makes "every commit passes CI on its own" unenforceable.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.12"

jobs:
  # ---------------------------------------------------------------------------
  # Work out what changed. Outputs a JSON matrix of service directories.
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changed workspace members
    runs-on: ubuntu-latest
    outputs:
      members: ${{ steps.detect.outputs.members }}
      any_python: ${{ steps.detect.outputs.any_python }}
      web: ${{ steps.detect.outputs.web }}
      mobile: ${{ steps.detect.outputs.mobile }}
      fhir_types: ${{ steps.detect.outputs.fhir_types }}
      audio_wire: ${{ steps.detect.outputs.audio_wire }}
      session_client: ${{ steps.detect.outputs.session_client }}
      nudge_client: ${{ steps.detect.outputs.nudge_client }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - id: detect
        shell: bash
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
            # First push to a new branch reports an all-zero base SHA.
            if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
              base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
            fi
          fi

          changed="$(git diff --name-only "$base" HEAD)"
          echo "Changed files:"
          echo "$changed"

          # The selection rules live in a script so they can be tested against
          # an arbitrary file list — see detect-changed-members.test.sh, and the
          # `detect-logic` job below that runs it. Only the base-SHA resolution
          # above stays inline, because it needs the GitHub event context and a
          # real repository; everything past this point is a pure function of
          # the path list. `tee` puts the decisions in the job log as well as in
          # $GITHUB_OUTPUT, so a surprising matrix can be read off the run.
          printf '%s\n' "$changed" \
            | bash .github/scripts/detect-changed-members.sh \
            | tee -a "$GITHUB_OUTPUT"


  # ---------------------------------------------------------------------------
  # Test the job-selection logic itself.
  #
  # Deliberately unconditional, with no `needs: changes`. Every other job runs
  # only when the detector selects it, so gating this one on the detector would
  # mean a bug that makes it select nothing also skips the test that would have
  # caught it. A self-test must not depend on the thing it tests. It needs only
  # checkout and bash, so running it always costs seconds.
  # ---------------------------------------------------------------------------
  detect-logic:
    name: Test change detection
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: detect-changed-members.test.sh
        run: bash .github/scripts/detect-changed-members.test.sh

  # ---------------------------------------------------------------------------
  # Lint — ruff over the whole workspace. Cheap enough not to bother scoping.
  # T20 (ban print()) is part of the rule set: print() can leak PHI to stdout.
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - run: uv sync --all-packages

      - name: ruff check
        run: uv run ruff check .

      - name: ruff format --check
        run: uv run ruff format --check .

  # ---------------------------------------------------------------------------
  # Type-check — mypy strict, per changed workspace member (service or package).
  # ---------------------------------------------------------------------------
  typecheck:
    name: Type-check (mypy)
    needs: changes
    if: needs.changes.outputs.any_python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.changes.outputs.members) }}
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - run: uv sync --all-packages

      - name: mypy ${{ matrix.member }}
        run: uv run mypy ${{ matrix.member }}/src

  # ---------------------------------------------------------------------------
  # Test — pytest per changed workspace member, against real backing services.
  # Coverage gate is 80% (CLAUDE.md); the root pyproject sets fail_under.
  # ---------------------------------------------------------------------------
  test:
    name: Test
    needs: changes
    if: needs.changes.outputs.any_python == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        member: ${{ fromJSON(needs.changes.outputs.members) }}

    # Backing services are NOT declared as job service containers. They come up
    # from docker-compose.yml in a step below, so the compose file is the only
    # place their versions are written. Declaring them here too created a
    # second pin that nothing kept in step: Dependabot watches the compose file
    # and cannot watch service containers (dependabot-core#5819, open since
    # 2022), so a bump landed on one side only and put local dev on postgres 18
    # while CI stayed on 16.
    env:
      ENVIRONMENT: test
      # Dummy values — moto intercepts every AWS call. No real credentials in CI.
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: testing
      AWS_SECRET_ACCESS_KEY: testing
      AWS_SESSION_TOKEN: testing
      AWS_DEFAULT_REGION: us-east-1
      DATABASE_URL: postgresql+asyncpg://medauth:medauth_ci@localhost:5432/medauth_test
      REDIS_URL: redis://localhost:6379/0
      QDRANT_HOST: localhost
      QDRANT_PORT: "6333"
      # Opts track-b-rag's embedding integration tests in. They load the real
      # BAAI/bge-large-en-v1.5 weights, which is the only way to assert the
      # (1024,) vector shape the Qdrant collection is built around. Gated by an
      # env var rather than always-on so a developer running the suite locally
      # does not trigger a ~1.3GB download they did not ask for.
      RUN_EMBEDDING_TESTS: "1"

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      # BAAI/bge-large-en-v1.5 is ~1.3GB. Without this it is re-downloaded from
      # HuggingFace on every run of every matrix member, which is minutes of
      # wall clock and a hard dependency on hf.co being up for a green build.
      # Keyed on the pinned model name so a model change busts the cache.
      - name: Cache HuggingFace model weights
        if: matrix.member == 'services/track-b-rag'
        uses: actions/cache@v6
        with:
          path: ~/.cache/huggingface
          key: hf-BAAI-bge-large-en-v1.5-${{ runner.os }}
          restore-keys: hf-BAAI-bge-large-en-v1.5-

      # The same stack a developer gets from `docker compose up`, with the same
      # images and the same healthchecks. `--wait` blocks until every named
      # service reports healthy, which is what the service containers'
      # --health-cmd options used to do.
      #
      - name: Start backing services
        env:
          POSTGRES_DB: medauth_test
          POSTGRES_PASSWORD: medauth_ci
        run: docker compose up -d --wait postgres redis qdrant

      # Started only for the members that test against it. It is a Spring Boot
      # application that builds a schema on first start, so it costs a couple of
      # minutes and every other job would pay that for nothing.
      #
      # track-b-rag joined fhir-integration here in TASK-052b: its end-to-end
      # test runs fhir-integration as a subprocess against this server, which is
      # the only way the launch half and the transcript half of that task are
      # proven in one run. Synthea cannot stand in for the resources it posts —
      # it emits no searchable Coverage at all.
      #
      # `--wait` is deliberately NOT used here, and readiness is polled from
      # outside instead. The image is distroless — no /bin/sh, no wget, no curl
      # — so it can carry no healthcheck (see docker-compose.yml), and without
      # one `--wait` returns the moment the container is *running*, which is
      # long before this server answers. Polling the CapabilityStatement is what
      # actually tells us it is up, and it fails loudly with logs rather than
      # letting the tests race the boot.
      - name: Start HAPI FHIR
        if: matrix.member == 'services/fhir-integration' || matrix.member == 'services/track-b-rag'
        env:
          POSTGRES_DB: medauth_test
          POSTGRES_PASSWORD: medauth_ci
        run: docker compose up -d hapi-fhir

      - name: Wait for HAPI FHIR to serve
        if: matrix.member == 'services/fhir-integration' || matrix.member == 'services/track-b-rag'
        run: |
          for attempt in $(seq 1 60); do
            if curl -sSf --max-time 5 http://localhost:8080/fhir/metadata >/dev/null 2>&1; then
              echo "HAPI FHIR answered after ${attempt} attempt(s)"
              exit 0
            fi
            sleep 5
          done
          echo "HAPI FHIR did not answer within 300s" >&2
          docker compose logs hapi-fhir
          exit 1

      - run: uv sync --all-packages

      # Every member runs against the same Postgres instance, so the schema has
      # to exist before any of them collect. init-db.sh applies both
      # histories in dependency order — hipaa-logger's audit_log first, then
      # track-a-clinical's core tables. Idempotent, so members whose tests
      # migrate again themselves are unaffected.
      - name: Apply migrations
        run: ./scripts/init-db.sh

      - name: pytest ${{ matrix.member }}
        working-directory: ${{ matrix.member }}
        shell: bash
        env:
          # The HAPI tests skip when no server answers, so a laptop without
          # the stack up still runs a clean suite. In CI the server is started
          # above for these members, so a skip would mean the tests quietly
          # stopped running — this turns that into a failure instead. Same
          # reasoning as pairing an env-gated test with a scheduled run.
          REQUIRE_HAPI_TESTS: ${{ (matrix.member == 'services/fhir-integration' || matrix.member == 'services/track-b-rag') && '1' || '0' }}
        run: |
          set -uo pipefail
          # `shell: bash` runs with -e already set by the runner, so the exit
          # status has to be captured inline — a bare `code=$?` on the next line
          # never executes, because -e aborts the script first.
          code=0
          uv run pytest tests \
            --cov=src \
            --cov-report=term-missing \
            --cov-report=xml || code=$?
          # Exit 5 is "no tests collected". Services are scaffolded before their
          # tests exist (Phase 0), so that is not a failure yet. Remove this
          # escape hatch once every service ships tests.
          if [ "$code" -eq 5 ]; then
            echo "::warning title=No tests::${{ matrix.member }} has no tests yet"
            exit 0
          fi
          exit "$code"

      # Artifact names cannot contain "/", and member is a path like
      # packages/hipaa-logger — flatten it before uploading.
      - name: Build coverage artifact name
        id: coverage_name
        if: always()
        shell: bash
        env:
          MEMBER: ${{ matrix.member }}
        run: echo "name=coverage-${MEMBER//\//-}" >> "$GITHUB_OUTPUT"

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.coverage_name.outputs.name }}
          path: ${{ matrix.member }}/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # fhir-types — the one package with two languages in one job.
  #
  # Its FHIR R4 resources are written twice: Pydantic models the backend validates
  # against, and TypeScript mirrors apps/web and apps/mobile compile against. Two
  # hand-written definitions of the same thing drift. Both sides run here together
  # so a green verdict means they agree, rather than each having been checked
  # alone: pytest carries the parity test that compares element names and closed
  # value sets across the two, and tsc proves the mirrors actually compile.
  #
  # The pytest run overlaps with this package's entry in the `test` matrix above.
  # That is deliberate — the matrix keeps every package covered by the same rules
  # as its siblings, and this job stays self-contained enough that its result
  # means something on its own.
  # ---------------------------------------------------------------------------
  fhir-types:
    name: FHIR types (Python + TypeScript)
    needs: changes
    if: needs.changes.outputs.fhir_types == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the only place the Node version is written. Reading it here
          # rather than repeating a number means a contributor's nvm/fnm and CI
          # cannot drift apart — the failure that pattern produces is a build
          # that passes on a laptop and fails in a pull request for reasons the
          # diff does not show. The floor in package.json's `engines` is a
          # separate thing: a minimum that npm enforces, not a second pin.
          node-version-file: .nvmrc

      - run: uv sync --all-packages

      - name: pytest — Pydantic models and TypeScript parity
        working-directory: packages/fhir-types
        run: uv run pytest tests --cov=src --cov-report=term-missing

      - run: npm ci

      - name: tsc --noEmit — TypeScript mirrors
        run: npm run typecheck --workspace @medauth/fhir-types

  audio-wire:
    name: Audio wire format (packages/audio-wire)
    needs: changes
    if: needs.changes.outputs.audio_wire == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the only place the Node version is written. Reading it here
          # rather than repeating a number means a contributor's nvm/fnm and CI
          # cannot drift apart — the failure that pattern produces is a build
          # that passes on a laptop and fails in a pull request for reasons the
          # diff does not show. The floor in package.json's `engines` is a
          # separate thing: a minimum that npm enforces, not a second pin.
          node-version-file: .nvmrc

      - run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck --workspace @medauth/audio-wire

      - name: vitest — 80% coverage gate, same as services/ and packages/
        run: npm run test --workspace @medauth/audio-wire

  session-client:
    name: Session client (packages/session-client)
    needs: changes
    if: needs.changes.outputs.session_client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the only place the Node version is written. Reading it here
          # rather than repeating a number means a contributor's nvm/fnm and CI
          # cannot drift apart — the failure that pattern produces is a build
          # that passes on a laptop and fails in a pull request for reasons the
          # diff does not show. The floor in package.json's `engines` is a
          # separate thing: a minimum that npm enforces, not a second pin.
          node-version-file: .nvmrc

      - run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck --workspace @medauth/session-client

      - name: vitest — 80% coverage gate, same as services/ and packages/
        run: npm run test --workspace @medauth/session-client

  nudge-client:
    name: Nudge client (packages/nudge-client)
    needs: changes
    if: needs.changes.outputs.nudge_client == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the only place the Node version is written — see the
          # session-client job above for why this is read rather than repeated.
          node-version-file: .nvmrc

      - run: npm ci

      - name: tsc --noEmit
        run: npm run typecheck --workspace @medauth/nudge-client

      - name: vitest — 80% coverage gate, same as services/ and packages/
        run: npm run test --workspace @medauth/nudge-client

  # ---------------------------------------------------------------------------
  # Frontends — only when the app actually changed and has a package.json.
  # ---------------------------------------------------------------------------
  web:
    name: Web (apps/web)
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the only place the Node version is written. Reading it here
          # rather than repeating a number means a contributor's nvm/fnm and CI
          # cannot drift apart — the failure that pattern produces is a build
          # that passes on a laptop and fails in a pull request for reasons the
          # diff does not show. The floor in package.json's `engines` is a
          # separate thing: a minimum that npm enforces, not a second pin.
          node-version-file: .nvmrc

      - name: Install, lint, type-check, test, build
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f apps/web/package.json ]; then
            echo "apps/web not scaffolded yet — skipping"
            exit 0
          fi
          npm ci
          npm run lint --workspace apps/web --if-present
          npm run typecheck --workspace apps/web --if-present
          npm run test --workspace apps/web --if-present
          npm run build --workspace apps/web --if-present

  mobile:
    name: Mobile (apps/mobile)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # .nvmrc is the only place the Node version is written. Reading it here
          # rather than repeating a number means a contributor's nvm/fnm and CI
          # cannot drift apart — the failure that pattern produces is a build
          # that passes on a laptop and fails in a pull request for reasons the
          # diff does not show. The floor in package.json's `engines` is a
          # separate thing: a minimum that npm enforces, not a second pin.
          node-version-file: .nvmrc

      - name: Install, lint, type-check, test
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f apps/mobile/package.json ]; then
            echo "apps/mobile not scaffolded yet — skipping"
            exit 0
          fi
          npm ci
          npm run lint --workspace apps/mobile --if-present
          npm run typecheck --workspace apps/mobile --if-present
          npm run test --workspace apps/mobile --if-present

  # ---------------------------------------------------------------------------
  # Single required status check for branch protection.
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    # audio-wire and detect-logic were both missing here. A job absent from this
    # list can fail without blocking a merge, which is the same silent-hole
    # failure the detector rules guard against, one layer up: the job runs, goes
    # red, and nothing stops the pull request.
    needs:
      [
        lint,
        typecheck,
        test,
        fhir-types,
        audio-wire,
        session-client,
        nudge-client,
        web,
        mobile,
        detect-logic,
      ]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any job failed
        shell: bash
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          for r in $results; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              exit 1
            fi
          done
