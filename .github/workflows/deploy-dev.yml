name: Deploy (dev) — STUB

# Placeholder only. Nothing is built, pushed, or deployed by this workflow today.
#
# Uncomment the real steps in Phase 6, once there is something to deploy and the
# AWS account is ready. Before enabling, the following must all be true:
#
#   1. Terraform in infrastructure/terraform provisions the dev EKS cluster, RDS,
#      ElastiCache and the Qdrant node.
#   2. An OIDC role exists for GitHub Actions (no long-lived AWS keys in secrets —
#      configure `permissions: id-token: write` and aws-actions/configure-aws-credentials).
#   3. Application secrets resolve from AWS Secrets Manager at runtime, never from
#      GitHub Actions secrets or a baked-in .env.
#   4. Images are built per service and pushed to ECR with the commit SHA as tag.
#   5. Deploys are HIPAA-relevant changes: the run must be auditable, so keep the
#      environment protection rule with a required reviewer.
#
# Until then this workflow is manual-dispatch only and does nothing but say so.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "This workflow is a stub and performs no deployment."
        required: false
        default: "acknowledged"

permissions:
  contents: read

jobs:
  noop:
    name: Deploy is not wired up yet
    runs-on: ubuntu-latest
    steps:
      - name: Explain
        run: |
          echo "deploy-dev is a stub — no deployment performed."
          echo "See the header comment in .github/workflows/deploy-dev.yml (Phase 6)."

