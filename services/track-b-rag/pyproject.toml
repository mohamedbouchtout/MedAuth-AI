[project]
name = "medauth-track-b-rag"
version = "0.1.0"
description = "Insurance policy RAG — Qdrant retrieval plus Claude on Bedrock. The technical core."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "boto3>=1.43.77",
    "fastapi>=0.115",
    # TASK-015. The Da Vinci CRD tier posts a CDS Hooks request to the payer's
    # endpoint; this is the first outbound HTTP call this service makes.
    "httpx>=0.28",
    "langchain>=1.3.15",
    "langchain-aws>=0.2",
    "langchain-text-splitters>=0.3",
    "medauth-api-envelope",
    "medauth-hipaa-logger",
    # TASK-016. The payer slug is what the Qdrant filter matches on and what the
    # rag: cache key is built from, so ingest and query have to agree about it.
    "medauth-payer-vocab",
    # Declared in TASK-010 ahead of its first use. TASK-011 imports the shared
    # SQLAlchemy models from track_a_clinical.models to write the
    # insurance_policies row; the dependency belongs in the diff that renames
    # this service to a named package, not appearing unexplained a task later.
    "medauth-track-a-clinical",
    "pymupdf>=1.24",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "qdrant-client>=1.12",
    "redis>=8.1.0",
    "sentence-transformers>=3.3",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/track_b_rag"]
