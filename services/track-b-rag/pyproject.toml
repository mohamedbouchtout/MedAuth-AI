[project]
name = "medauth-track-b-rag"
version = "0.1.0"
description = "Insurance policy RAG — Qdrant retrieval plus Claude on Bedrock. The technical core."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "boto3>=1.35",
    "fastapi>=0.115",
    "langchain>=0.3",
    "langchain-aws>=0.2",
    "langchain-text-splitters>=0.3",
    "medauth-hipaa-logger",
    "pymupdf>=1.24",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-multipart>=0.0.12",
    "qdrant-client>=1.12",
    "redis>=8.1.0",
    "sentence-transformers>=3.3",
    "sqlalchemy[asyncio]>=2.0",
    "uvicorn[standard]>=0.32",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
