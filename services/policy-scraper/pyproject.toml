[project]
name = "medauth-policy-scraper"
version = "0.1.0"
description = "Nightly CronJob that scrapes public payer policy PDFs and feeds the ingestion pipeline."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "beautifulsoup4>=4.15.0",
    "httpx>=0.28",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pymupdf>=1.24",
    "sqlalchemy[asyncio]>=2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
