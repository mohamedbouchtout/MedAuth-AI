[project]
name = "medauth-policy-scraper"
version = "0.1.0"
description = "Nightly CronJob that scrapes public payer policy PDFs and feeds the ingestion pipeline."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "httpx>=0.28",
    # TASK-013 reads insurance_policies.content_hash before uploading, which
    # crosses the service-import boundary. See CLAUDE.md, "Where the shared
    # SQLAlchemy models live" — this is why the package is src/policy_scraper/
    # rather than a bare src/.
    "medauth-track-a-clinical",
    # Canonical payer slugs and USPS state codes. CMS documents ingest as
    # cms-medicare, and MAC jurisdiction codes are not all USPS codes.
    "medauth-payer-vocab",
    # TASK-009. The pre-upload skip compares a digest this service computes
    # with the one ingest stored, so it is only worth anything while the two
    # are the same function. Both call html_digest rather than this service
    # hashing on its own.
    "medauth-html-digest",
    # Raises httpx and urllib3 above the level at which they write request
    # URLs. This service fetches public payer publications, so its own URLs
    # carry no patient identifier — it installs the policy because what a
    # library may write is settled platform-wide rather than per service.
    "medauth-logging-policy",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_scraper"]
