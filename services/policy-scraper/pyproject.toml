[project]
name = "medauth-policy-scraper"
version = "0.1.0"
description = "Nightly CronJob that scrapes public payer policy PDFs and feeds the ingestion pipeline."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "httpx>=0.28",
    # TASK-013 reads insurance_policies.content_hash before uploading, which
    # crosses the service-import boundary. See CLAUDE.md, "Where the shared
    # SQLAlchemy models live" — this is why the package is src/policy_scraper/
    # rather than a bare src/.
    "medauth-track-a-clinical",
    # Canonical payer slugs and USPS state codes. CMS documents ingest as
    # cms-medicare, and MAC jurisdiction codes are not all USPS codes.
    "medauth-payer-vocab",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.52",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/policy_scraper"]
