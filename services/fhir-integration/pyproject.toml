[project]
name = "medauth-fhir-integration"
version = "0.1.0"
description = "SMART on FHIR OAuth and the multi-EHR adapter layer. Python — see TASK-050."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "medauth-api-envelope",
    "medauth-cors-policy",
    "medauth-fhir-types",
    "medauth-hipaa-logger",
    "medauth-payer-vocab",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.6",
    # The crypto extra is required, not optional: TASK-051c verifies an EHR
    # id_token's RS256/ES256 signature, and PyJWT cannot do that without it.
    "pyjwt[crypto]>=2.13.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.4",
]

[dependency-groups]
dev = [
    # Test-only, and only for tests/unit/test_note_contract.py: TASK-053's note
    # write-back mirrors two of track-a-clinical's response payloads so it can
    # read them over HTTP, and that file proves the mirrors match by building
    # the payloads from that service's own models rather than by hand.
    # Deliberately NOT a runtime dependency — nothing in src/ imports
    # track_a_clinical, and nothing should: the two services are bound by a wire
    # contract, and an import would make a deployment of one require a redeploy
    # of the other. Same arrangement as packages/session-auth's issuer contract.
    "medauth-track-a-clinical",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
