[project]
name = "medauth-fhir-integration"
version = "0.1.0"
description = "SMART on FHIR OAuth and the multi-EHR adapter layer. Python — see TASK-050."
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.28",
    "medauth-api-envelope",
    "medauth-cors-policy",
    "medauth-fhir-types",
    "medauth-hipaa-logger",
    "medauth-payer-vocab",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.6",
    "pyjwt>=2.13.0",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
