[project]
name = "medauth-prior-auth"
version = "0.1.0"
description = "Prior authorization bundle assembly and submission routing."
requires-python = ">=3.12"
dependencies = [
    "asyncpg>=0.30",
    "fastapi>=0.115",
    "httpx>=0.28",
    "medauth-api-envelope",
    # TASK-061 gave this service its first browser-facing route: TASK-072's
    # dashboard resubmits a denied request through it. Per CLAUDE.md, CORS is
    # installed when a service grows such a route, from the shared package
    # rather than hand-rolled per service.
    "medauth-cors-policy",
    "medauth-fhir-types",
    "medauth-hipaa-logger",
    "medauth-logging-policy",
    "medauth-payer-vocab",
    # The shared SQLAlchemy models. TASK-060 reads clinical_notes and
    # clinical_nudges and writes prior_auth_requests, and CLAUDE.md's "Where the
    # shared SQLAlchemy models live" requires importing the mapped classes from
    # here rather than mapping a second definition against the same tables.
    # This is what makes the named package below necessary.
    "medauth-track-a-clinical",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.6",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
# A named package rather than `src`, for the reason CLAUDE.md gives for
# track-a-clinical and track-b-rag: every service declaring `packages = ["src"]`
# installs a top-level module called `src` into the shared virtualenv, and they
# shadow each other. That is tolerable only while nothing imports across a
# service boundary. TASK-060 crosses it — this service imports
# `track_a_clinical.models` — so the rename happens now, while the service is
# still empty, rather than as churn afterwards.
packages = ["src/prior_auth"]
