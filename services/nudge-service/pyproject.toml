[project]
name = "medauth-nudge-service"
version = "0.1.0"
description = "Redis pub/sub to WebSocket relay for live clinical nudges."
requires-python = ">=3.12"
dependencies = [
    "anyio>=4.6",
    "fastapi>=0.115",
    "medauth-api-envelope",
    "medauth-hipaa-logger",
    "medauth-session-auth",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.6",
    "redis>=8.1.0",
    "uvicorn[standard]>=0.52.4",
    "websockets>=13.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
