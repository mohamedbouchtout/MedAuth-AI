[project]
name = "medauth-track-a-clinical"
version = "0.1.0"
description = "SOAP note generation via Claude on Bedrock. Owns the Alembic schema for the platform."
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.14",
    "asyncpg>=0.30",
    "boto3>=1.43.77",
    "fastapi>=0.115",
    "langchain>=1.3.15",
    "langchain-aws>=0.2",
    "medauth-api-envelope",
    "medauth-fhir-types",
    "medauth-hipaa-logger",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyjwt>=2.10",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/track_a_clinical"]
