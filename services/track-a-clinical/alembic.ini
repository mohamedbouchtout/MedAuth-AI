# Alembic configuration for services/track-a-clinical.
#
# This service owns the migration history for the platform's core schema —
# encounters, clinical_notes, clinical_nudges, prior_auth_requests and
# insurance_policies. Owning the history is not the same as owning write access:
# track-b-rag writes clinical_nudges and prior-auth writes prior_auth_requests,
# both through the models in src/track_a_clinical/models.
#
#   cd services/track-a-clinical && uv run alembic upgrade head
#
# audit_log is not here. It belongs to packages/hipaa-logger and is applied
# first — scripts/init-db.sh runs both in the right order.
#
# The database URL is not stored here; env.py reads DATABASE_URL so one value
# serves every consumer in the monorepo.

[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
