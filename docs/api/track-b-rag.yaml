openapi: 3.1.0

# The published contract for services/track-b-rag.
#
# Kept in step with the FastAPI app by
# services/track-b-rag/tests/unit/api/test_openapi_contract.py, which fails if a
# route, method or status code here drifts from the application. Update this
# file in the same change that adds or alters a route.

info:
  title: MedAuth AI — track-b-rag
  version: 0.1.0
  description: >-
    Insurance policy retrieval-augmented generation. Owns the Qdrant
    `insurance_policies` collection and the local `BAAI/bge-large-en-v1.5`
    embedding model, and answers prior authorization questions during a live
    encounter. Policy ingestion (`/policies/ingest`) landed in TASK-011, the
    query endpoint (`/policies/query`) in TASK-012.

servers:
  - url: http://localhost:8002
    description: Local development (see the port table in CLAUDE.md)

tags:
  - name: health
    description: Readiness of this service's backing dependencies.
  - name: policies
    description: >-
      Ingestion of payer policy documents and queries against them. Internal
      service-to-service only — reachable from inside the cluster, never
      through an ingress.

paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Service health
      description: >-
        Reports whether Qdrant, the embedding model and Redis are all usable.
        200 when all three are `ok`, 503 when any is `error`. The body is the
        standard envelope in both cases and always names the individual
        dependencies, so a failing probe is diagnosable from the response alone
        — a 503 carries `data`, not `error`, because the request itself
        succeeded.

        Unauthenticated and deliberately unaudited: this is what the Kubernetes
        readiness probe calls, it exposes no patient data, and CLAUDE.md exempts
        health endpoints from the hipaa-logger requirement.
      responses:
        '200':
          description: >-
            Readiness of the vector store, the embedding model and the cache.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: At least one dependency is unreachable. The body names which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /policies/ingest:
    post:
      tags: [policies]
      operationId: ingest
      summary: Ingest a policy document
      description: >-
        Chunks a payer policy document, embeds it, writes the vectors to
        Qdrant and records the document in `insurance_policies`. Takes a PDF or
        HTML, declared by `content_type` — payers publish PDFs, and CMS's
        Medicare Coverage Database publishes HTML and offers no PDF at all.
        Dedup is keyed on the
        SHA-256 digest of the uploaded bytes: a new `policy_id` is `created`, a
        matching digest is `unchanged` and does no work at all, and a changed
        digest is `updated` — which removes the document's existing chunks
        before writing the new ones, so a superseded revision cannot linger in
        retrieval. All three are 200; the `status` field says which happened.

        Internal service-to-service endpoint, called by the policy scraper
        (TASK-013) and `scripts/seed-policies.py` (TASK-014). It carries no
        authentication of its own — access control is network isolation, and
        service-to-service auth is a separate future task. Writes no audit row:
        policy documents are public payer publications with no patient linkage,
        and Known Constraints #6 makes the audit write conditional on touching
        PHI.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/IngestPolicyRequest'
      responses:
        '200':
          description: What the ingest did, and how many chunks it wrote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IngestPolicyResponse'
        '400':
          description: >-
            The upload is not a readable PDF, or holds no extractable text to
            index.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request body or path parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /policies/query:
    post:
      tags: [policies]
      operationId: query_policies
      summary: Query prior authorization requirements
      description: >-
        Answers whether a payer requires prior authorization for a procedure,
        what it requires to be documented, what this encounter has not yet
        documented, and what to tell the provider. Called by TASK-021's
        transcript consumer the moment a procedure keyword is heard.

        The answer is assembled in two stages that are cached differently. The
        payer half — `requires_auth`, `auth_criteria`, `step_therapy_required`,
        `step_therapy_details` — is resolved from indexed policy text with
        Claude Sonnet on Bedrock and cached for 24h under
        `rag:{payer}:{plan_type}:{state}:{cpt_code}`, whose payer segment is
        the canonical slug rather than the name as sent. The patient half —
        `missing_criteria`, `denial_risk`, `nudge_message` — is recomputed on
        every call from `clinical_context` and never cached, because those
        fields describe one encounter's documentation and sharing them between
        patients would report one patient's gaps for another.

        Always 200 on a well-formed request. When the payer's rules cannot be
        established — nothing indexed, an unreachable dependency, or an answer
        that will not parse — the response is the safe default: authorization
        assumed required, `denial_risk` high, and a message asking for a manual
        check. An error status is not used, because the caller fires nudges
        during a live encounter and would read one as "nothing to worry about".

        Writes an `audit_log` row, unlike `/policies/ingest`: the request
        carries a live encounter's clinical context, which is PHI. The row
        names the provider and the session only — never the clinical detail,
        the procedure or the code.

        Internal service-to-service endpoint. Access control is network
        isolation; it carries no authentication of its own.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyQueryRequest'
      responses:
        '200':
          description: >-
            The payer's requirements and this encounter's gaps against them.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyQueryResponse'
        '422':
          description: >-
            The request body is invalid — a missing field, a malformed state
            code, or a session_id or provider_id that is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /nudges/{nudge_id}/acknowledge:
    patch:
      tags: [nudges]
      operationId: acknowledge_nudge
      summary: Acknowledge a nudge
      description: >-
        Marks a nudge as dismissed by the provider it was shown to, setting
        `acknowledged` and `acknowledged_at`. Called by the dismiss button in
        `apps/web` (TASK-042) and `apps/mobile` (TASK-043), using the `nudge_id`
        carried in the nudge payload they rendered — which is the primary key of
        a row TASK-040 wrote before publishing, so only a nudge that was
        actually recorded can be dismissed.

        Idempotent. A repeat call returns 200 with `already_acknowledged` true
        and the original `acknowledged_at`, so a double tap or a retried request
        cannot move a timestamp recording when a provider actually saw the
        alert.

        404 covers two cases deliberately: no such nudge, and a nudge whose
        encounter has been soft-deleted. `clinical_nudges` carries no
        `deleted_at` of its own — a nudge records what a provider was told at a
        point in time — so the second is resolved by joining `encounters`.

        Writes an `audit_log` row naming the encounter's provider:
        `ACKNOWLEDGE_NUDGE` when the call changed the row, `READ_NUDGE` when it
        did not. The row names identifiers only, never the procedure, the code
        or the criteria.

        Carries no credential in v1, and the actor is read from the encounter
        rather than from the caller — see CLAUDE.md, "A route keyed on a
        resource rather than a session follows the same v1 rule". Not reachable
        from a browser until TASK-041c settles CORS.
      parameters:
        - name: nudge_id
          in: path
          required: true
          description: The `clinical_nudges` row to acknowledge.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AcknowledgeNudgeRequest'
      responses:
        '200':
          description: >-
            The nudge's acknowledgement state and when it was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcknowledgeNudgeResponse'
        '404':
          description: >-
            No such nudge, or the encounter it belongs to has been soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            The nudge_id is not a UUID, or the body is not
            `{"acknowledged": true}` — false is rejected rather than read as an
            un-acknowledge.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ComponentStatus:
      type: string
      enum: [ok, error]

    HealthData:
      type: object
      required: [qdrant, embedding_model, redis, transcript_consumer]
      properties:
        qdrant:
          $ref: '#/components/schemas/ComponentStatus'
          description: Whether the Qdrant vector store answers.
        embedding_model:
          $ref: '#/components/schemas/ComponentStatus'
          description: >-
            Whether the local sentence-transformers model is loaded and usable.
            The first probe after startup pays for the load, so it can report
            `error` briefly while the weights come into memory.
        redis:
          $ref: '#/components/schemas/ComponentStatus'
          description: >-
            Whether the Redis cache behind `/policies/query` answers. A query
            still succeeds without it, at full Bedrock cost on every call.
        transcript_consumer:
          $ref: '#/components/schemas/ComponentStatus'
          description: >-
            Whether the transcript consumer is running and subscribed. When it
            is not, no procedure keyword is detected in any encounter on this
            instance and no nudge is raised — a failure that otherwise looks
            exactly like a clinic with nothing to flag.

    HealthResponse:
      type: object
      description: The standard envelope, carrying health flags.
      required: [data, error]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/HealthData'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'

    IngestPolicyRequest:
      type: object
      description: >-
        The policy document and its metadata, as one multipart body. The file is
        a field of this model rather than a separate parameter because FastAPI
        only flattens a form model into individual fields when that model is the
        sole body parameter.
      required: [policy_id, payer, file]
      properties:
        policy_id:
          type: string
          minLength: 1
          maxLength: 200
          description: The payer's own identifier for the document. Unique per policy.
        payer:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Issuing payer, e.g. 'Aetna' or 'CMS'. Recorded as sent; indexed under
            its canonical slug so any spelling of the same payer retrieves it.
        plan_type:
          type: [string, 'null']
          maxLength: 100
          description: >-
            Plan type the policy applies to, e.g. 'PPO'. Omit if it applies to
            all.
        state:
          type: [string, 'null']
          pattern: '^[A-Z]{2}$'
          description: >-
            Two-letter state code, or omitted for a policy that applies
            nationally. Lowercase input is normalised to uppercase.
        source_url:
          type: [string, 'null']
          description: Where the document was retrieved from, recorded for provenance.
        effective_date:
          type: [string, 'null']
          format: date
          description: The payer's stated effective date for this version of the policy.
        jurisdiction_states:
          type: array
          items:
            type: string
            pattern: '^[A-Za-z]{2}$'
          description: >-
            USPS state codes for a policy issued per contractor jurisdiction — a
            Medicare LCD applies across its contractor's whole jurisdiction, a
            median of twelve states. Sent as repeated form fields. Use this or
            `state`, never both; omit both for a national policy. Lowercase
            input is normalised to uppercase.
        content_type:
          type: string
          enum: [application/pdf, text/html]
          default: application/pdf
          description: >-
            The format of the uploaded document, declared by the caller rather
            than sniffed. Defaults to PDF, which is what payers publish.
        file:
          type: string
          format: binary
          description: The policy document, in the declared format.

    IngestPolicyData:
      type: object
      required: [policy_id, status, content_hash, chunks_indexed, collection]
      properties:
        policy_id:
          type: string
        status:
          type: string
          enum: [created, updated, unchanged]
          description: >-
            'created' for a new policy_id, 'updated' when the content hash
            changed, 'unchanged' when the document was already indexed.
        content_hash:
          type: string
          description: SHA-256 hex digest of the uploaded PDF bytes.
        chunks_indexed:
          type: integer
          minimum: 0
          description: >-
            Chunks written by this call. Zero when the document was unchanged,
            which means it was skipped — not that the collection holds nothing
            for it.
        collection:
          type: string
          description: Qdrant collection the chunks were written to.

    IngestPolicyResponse:
      type: object
      description: The standard envelope, carrying the ingest outcome.
      required: [data, error]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/IngestPolicyData'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'

    PolicyQueryRequest:
      type: object
      description: >-
        One procedure, for one encounter. `session_id` and `provider_id` are
        carried for the audit row this route writes; they authenticate nothing.
      required: [procedure, cpt_code, payer, plan_type, state, session_id, provider_id]
      properties:
        procedure:
          type: string
          minLength: 1
          maxLength: 200
          description: The procedure as the clinician described it, e.g. 'knee MRI'.
        cpt_code:
          type: string
          minLength: 1
          maxLength: 10
          description: >-
            CPT or HCPCS code for the procedure. Lowercase input is normalised
            to uppercase.
        payer:
          type: string
          minLength: 1
          maxLength: 200
          description: >-
            Issuing payer, in any spelling — including a FHIR Coverage display
            name such as 'Medicare Part B'. Resolved to the same canonical slug
            ingestion used, so the caller does not have to know how the payer's
            documents were spelled.
        plan_type:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            Plan type, e.g. 'PPO'. Part of the cache key, so it is required
            here even though ingestion treats it as optional.
        state:
          type: string
          pattern: '^[A-Z]{2}$'
          description: >-
            Two-letter state code for the encounter. Lowercase input is
            normalised to uppercase. Policies ingested with no state apply
            nationally and are searched alongside the state-specific ones.
        clinical_context:
          type: object
          additionalProperties: true
          description: >-
            What this encounter has documented so far. Compared against the
            payer's criteria on every call and never cached, never embedded,
            and never sent to Bedrock.
        session_id:
          type: string
          format: uuid
          description: The encounter session, recorded in the audit row.
        provider_id:
          type: string
          format: uuid
          description: The acting provider, recorded as the audit row's actor.

    PolicyQueryData:
      type: object
      required:
        - requires_auth
        - auth_criteria
        - missing_criteria
        - denial_risk
        - nudge_message
        - step_therapy_required
        - step_therapy_details
        - policy_source
        - source
      properties:
        requires_auth:
          type: boolean
          description: >-
            Whether the payer requires prior authorization for this procedure.
        auth_criteria:
          type: array
          items:
            type: string
          description: >-
            What the payer requires to be documented before it will authorize.
        missing_criteria:
          type: array
          items:
            type: string
          description: >-
            The criteria this encounter has not yet documented. Recomputed on
            every call — never served from cache.
        denial_risk:
          type: string
          enum: [low, medium, high]
          description: >-
            How likely a claim is to be denied given what is documented so far.
        nudge_message:
          type: [string, 'null']
          description: >-
            The message to put in front of the provider, mid-encounter, or null
            when there is nothing worth interrupting the consultation for. This
            is the nudge trigger (TASK-040): a caller raises a nudge if and only
            if this is non-null, and never re-derives that condition from
            missing_criteria or denial_risk, which is how the two came to
            disagree. Null when authorization is not required, or when it is
            required and every criterion is documented — in both cases with no
            step therapy requirement, which always has something to say.
        step_therapy_required:
          type: boolean
          description: >-
            Whether the plan requires a first-line therapy to be tried first.
        step_therapy_details:
          type: [string, 'null']
          description: What the step therapy requirement is, when there is one.
        policy_source:
          type: [string, 'null']
          description: >-
            Which indexed policy documents the criteria were read from,
            comma-separated. Null on a fallback, where no policy text was read
            at all. This is what a reviewer checks a nudge's criteria against,
            so it is derived from what retrieval returned and never from the
            model's own answer.
        source:
          type: string
          enum: [cache, rag, fallback, crd, crd+cache, crd+rag]
          description: >-
            Which tier established the payer's rules. Branch only on `fallback`,
            which means they could not be established at all — the empty
            `auth_criteria` then means "unknown", not "none", and a caller must
            not treat the answer as verified. The rest distinguishes how an
            established answer was reached and is provenance for logs and nudge
            records, not a branch condition.

    PolicyQueryResponse:
      type: object
      description: The standard envelope, carrying the policy answer.
      required: [data, error]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/PolicyQueryData'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'

    AcknowledgeNudgeRequest:
      type: object
      description: >-
        One state transition, stated rather than implied. A body with a single
        constant field is the shape for a PATCH-as-state-transition route here:
        it keeps the request self-describing and leaves room for a later field
        without turning an empty body into a populated one.
      required: [acknowledged]
      additionalProperties: false
      properties:
        acknowledged:
          type: boolean
          const: true
          description: >-
            Always true. `false` is rejected rather than read as an
            un-acknowledge — this endpoint sets the flag, and the reverse
            transition is not specified.

    AcknowledgeNudgeData:
      type: object
      required: [nudge_id, acknowledged, acknowledged_at, already_acknowledged]
      properties:
        nudge_id:
          type: string
          format: uuid
          description: The acknowledged nudge.
        acknowledged:
          type: boolean
          description: Always true once this route has answered 200.
        acknowledged_at:
          type: string
          format: date-time
          description: >-
            When the nudge was acknowledged, in ISO 8601 UTC. Unchanged by a
            repeat call — a second dismissal does not move the first one.
        already_acknowledged:
          type: boolean
          description: >-
            Whether this call was a no-op repeat. False means this call is the
            one that changed the row.

    AcknowledgeNudgeResponse:
      type: object
      description: The standard envelope, carrying the acknowledgement state.
      required: [data, error]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/AcknowledgeNudgeData'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'

    ErrorResponse:
      type: object
      description: The standard envelope with its error half populated.
      required: [data, error]
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'

    Error:
      type: object
      description: >-
        The error half of the envelope. Health never populates it; the shared
        error handlers do, for routes that fail.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - http_error
            - invalid_document
            - empty_document
            - nudge_not_found
        message:
          type: string
