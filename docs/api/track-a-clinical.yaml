openapi: 3.1.0

# The published contract for services/track-a-clinical.
#
# Kept in step with the FastAPI app by
# services/track-a-clinical/tests/unit/api/test_openapi_contract.py, which fails
# if a route, method, status code or required request field here drifts from the
# application. Update this file in the same change that adds or alters a route.

info:
  title: MedAuth AI — track-a-clinical
  version: 0.1.0
  description: >-
    SOAP note generation and session lifecycle. Owns the `encounters` table and
    is the only issuer of session JWTs — `audio-ingestion` and `nudge-service`
    validate the token minted here and never mint their own.

servers:
  - url: http://localhost:8003
    description: Local development (see the port table in CLAUDE.md)

tags:
  - name: health
    description: Readiness for the Kubernetes probe.
  - name: sessions
    description: Start a clinical encounter, refresh its token, and end it.

paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Service health
      description: >-
        Reports whether Redis and the transcript consumer are usable. 200 when
        both are `ok`, 503 when either is `error`. The body is the standard
        envelope in both cases and always names the individual dependencies, so
        a failing probe is diagnosable from the response alone — a 503 carries
        `data`, not `error`, because the request itself succeeded.

        Unauthenticated and deliberately unaudited: this is what the Kubernetes
        readiness probe calls, it exposes no patient data, and CLAUDE.md exempts
        health endpoints from the hipaa-logger requirement.
      responses:
        '200':
          description: Readiness of Redis and the transcript consumer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: At least one dependency is unavailable. The body names which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /sessions/start:
    post:
      tags: [sessions]
      operationId: startSession
      summary: Start a session
      description: >-
        Creates an `encounters` row with `status='active'` and mints the session
        JWT. `session_id` is generated server-side and is never accepted from the
        client. The encounter row and its `audit_log` row commit together. The
        new `session_id` is then published to the `sessions:started` channel,
        which is how per-session transcript consumers learn to subscribe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionRequest'
      responses:
        '201':
          description: The new session's id and its short-lived JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSessionResponse'
        '422':
          description: The request body or path parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The session was created but its start signal could not be published.
            The encounter exists and is `active`, but no transcript consumer
            knows about it, so the client should discard the session and start a
            new one rather than proceeding unwatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{session_id}/end:
    post:
      tags: [sessions]
      operationId: endSession
      summary: End a session
      description: >-
        Sets `status='completed'` and `ended_at`, then publishes an empty message
        to the Redis channel `session:ended:{session_id}`. TASK-030 (SOAP
        generation) and TASK-060 (prior auth bundle assembly) both subscribe to
        it.


        Idempotent: repeating the call on an already-completed session returns
        200 with `already_ended: true` and publishes nothing, because a second
        signal would produce a second SOAP note and a second prior-auth bundle
        for one visit.
      parameters:
        - name: session_id
          in: path
          required: true
          description: The `session_id` returned by `POST /sessions/start`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The session's final status and end time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndSessionResponse'
        '404':
          description: The session is unknown or its encounter is soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request body or path parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The session ended but its signal could not be published. The
            encounter is already `completed`; retrying will not re-send the
            signal, so replaying it is an operator action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{session_id}/token:
    post:
      tags: [sessions]
      operationId: remintSessionToken
      summary: Re-mint a session token
      description: >-
        Mints a fresh JWT for a session already under way, carrying the **same**
        `session_id`, the encounter's existing `provider_id`, and a new `exp`.
        Creates no row, mutates none, and publishes nothing. Returns 200 rather
        than 201 — nothing is created, which is the distinction from
        `/sessions/start`.


        A visit routinely outlasts the 15-minute `SESSION_TTL_SECONDS`. Because
        every real-time endpoint validates the token only during the handshake,
        an already-open socket is unaffected; this endpoint exists for the case
        where a *new* socket has to be opened after `exp` — a reconnect, or the
        nudge socket opening later than the audio socket. Calling
        `POST /sessions/start` again instead would fork one visit into two
        encounters, silently.


        Authorisation is the session's own token in an `Authorization: Bearer`
        header, expired or not, accepted while it is no more than
        `SESSION_REMINT_GRACE_SECONDS` past its `exp`. The token must carry the
        same `session_id` as the path. Note that re-minting revokes nothing: with
        no `jti` and no server-side token store, every token issued for this
        session inside that window remains equally acceptable, including one a
        later re-mint superseded. Ending the encounter is the only revocation
        available today. Tracked as issue #51.
      parameters:
        - name: session_id
          in: path
          required: true
          description: The `session_id` whose token is being refreshed.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The same session's id and a freshly minted JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemintTokenResponse'
        '401':
          description: >-
            No session token was presented, or the one presented is invalid, is
            for a different session, or expired longer ago than the grace window
            allows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The session is unknown or its encounter is soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The encounter is already completed. A finished visit cannot obtain a
            token, because that token could reopen its audio socket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request body or path parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    ComponentStatus:
      type: string
      enum: [ok, error]

    HealthData:
      type: object
      required: [redis, transcript_consumer]
      properties:
        redis:
          $ref: '#/components/schemas/ComponentStatus'
          description: >-
            Whether Redis answers. This service both publishes the session
            lifecycle signals and consumes the transcript bus over it, so an
            unreachable Redis means new sessions cannot be announced and no
            transcript is accumulated.
        transcript_consumer:
          $ref: '#/components/schemas/ComponentStatus'
          description: >-
            Whether the transcript consumer is running and subscribed. When it
            is not, no encounter on this instance accumulates a transcript and
            none produces a SOAP note — a failure that otherwise surfaces only
            as TASK-060 exhausting its retries, one warning per visit. The one
            consumer serves the announcement, transcript and end channels
            together, so there is no separate flag for the end signal: two
            flags that cannot disagree would imply coverage that does not exist.

    HealthResponse:
      type: object
      description: The standard envelope, carrying health flags.
      required: [data, error]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/HealthData'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'

    StartSessionRequest:
      type: object
      additionalProperties: false
      required: [patient_id, provider_id]
      properties:
        patient_id:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            The patient's FHIR resource id. Stored as `encounters.patient_fhir_id`
            — the wire name and the column name differ deliberately.
          examples: ['synthea-placeholder-1']
        provider_id:
          type: string
          format: uuid
          description: The provider starting the visit.
        ehr_encounter_id:
          type: [string, 'null']
          maxLength: 100
          default: null
          description: The EHR's own Encounter resource id, when launched from one.
          examples: ['athena-enc-9001']

    StartSessionData:
      type: object
      required: [session_id, jwt]
      properties:
        session_id:
          type: string
          format: uuid
        jwt:
          type: string
          description: >-
            HS256, signed with `JWT_SIGNING_KEY`. Claims are exactly
            `{session_id, provider_id, exp}` — no `iss` or `aud` in v1. Expires
            after `SESSION_TTL_SECONDS` (900 by default).

    EndSessionData:
      type: object
      required: [session_id, status, ended_at, already_ended]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed]
        ended_at:
          type: string
          format: date-time
          description: ISO 8601 UTC, written by the database as `NOW()`.
        already_ended:
          type: boolean
          description: True when this call was a no-op repeat and published no signal.

    RemintTokenData:
      type: object
      required: [session_id, jwt]
      description: >-
        Structurally identical to `StartSessionData`, and named separately on
        purpose: a re-mint response should not be described by a schema whose
        name says a session was started, when starting nothing is the point.
      properties:
        session_id:
          type: string
          format: uuid
          description: >-
            Echoed back, and always the session that was asked for — never a new
            one. A client can assert on it to catch a fork.
        jwt:
          type: string
          description: >-
            Same claim set and signing as `/sessions/start` issues — exactly
            `{session_id, provider_id, exp}`, HS256 under `JWT_SIGNING_KEY`. Only
            `exp` differs from the token it replaces.

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - session_not_found
            - signal_not_published
            - auth_rejected
            - session_completed
            - validation_error
            - http_error
        message:
          type: string
          description: >-
            Human-readable and PHI-free. A rejected request body is described by
            field location only; its values are never echoed back.

    StartSessionResponse:
      type: object
      required: [data, error]
      description: The standard envelope from CLAUDE.md's API Design section.
      properties:
        data:
          $ref: '#/components/schemas/StartSessionData'
        error:
          type: 'null'

    EndSessionResponse:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: '#/components/schemas/EndSessionData'
        error:
          type: 'null'

    RemintTokenResponse:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: '#/components/schemas/RemintTokenData'
        error:
          type: 'null'

    ErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
