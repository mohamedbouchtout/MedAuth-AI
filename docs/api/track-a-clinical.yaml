openapi: 3.1.0

# The published contract for services/track-a-clinical.
#
# Kept in step with the FastAPI app by
# services/track-a-clinical/tests/unit/api/test_openapi_contract.py, which fails
# if a route, method, status code or required request field here drifts from the
# application. Update this file in the same change that adds or alters a route.

info:
  title: MedAuth AI — track-a-clinical
  version: 0.1.0
  description: >-
    SOAP note generation and session lifecycle. Owns the `encounters` table and
    is the only issuer of session JWTs — `audio-ingestion` and `nudge-service`
    validate the token minted here and never mint their own.

servers:
  - url: http://localhost:8003
    description: Local development (see the port table in CLAUDE.md)

tags:
  - name: health
    description: Readiness for the Kubernetes probe.
  - name: sessions
    description: Start a clinical encounter, refresh its token, and end it.
  - name: notes
    description: Read and edit the SOAP note generated for a finished encounter.

paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Service health
      description: >-
        Reports whether Redis and the transcript consumer are usable. 200 when
        both are `ok`, 503 when either is `error`. The body is the standard
        envelope in both cases and always names the individual dependencies, so
        a failing probe is diagnosable from the response alone — a 503 carries
        `data`, not `error`, because the request itself succeeded.

        Unauthenticated and deliberately unaudited: this is what the Kubernetes
        readiness probe calls, it exposes no patient data, and CLAUDE.md exempts
        health endpoints from the hipaa-logger requirement.
      responses:
        '200':
          description: Readiness of Redis and the transcript consumer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: At least one dependency is unavailable. The body names which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /sessions/start:
    post:
      tags: [sessions]
      operationId: startSession
      summary: Start a session
      description: >-
        Creates an `encounters` row with `status='active'` and mints the session
        JWT. `session_id` is generated server-side and is never accepted from the
        client. The encounter row and its `audit_log` row commit together. The
        new `session_id` is then published to the `sessions:started` channel,
        which is how per-session transcript consumers learn to subscribe.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionRequest'
      responses:
        '201':
          description: The new session's id and its short-lived JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StartSessionResponse'
        '422':
          description: The request body or path parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The session was created but its start signal could not be published.
            The encounter exists and is `active`, but no transcript consumer
            knows about it, so the client should discard the session and start a
            new one rather than proceeding unwatched.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{session_id}/end:
    post:
      tags: [sessions]
      operationId: endSession
      summary: End a session
      description: >-
        Sets `status='completed'` and `ended_at`, then publishes an empty message
        to the Redis channel `session:ended:{session_id}`. TASK-030 (SOAP
        generation) and TASK-060 (prior auth bundle assembly) both subscribe to
        it.


        Idempotent: repeating the call on an already-completed session returns
        200 with `already_ended: true` and publishes nothing, because a second
        signal would produce a second SOAP note and a second prior-auth bundle
        for one visit.
      parameters:
        - name: session_id
          in: path
          required: true
          description: The `session_id` returned by `POST /sessions/start`.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The session's final status and end time.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EndSessionResponse'
        '404':
          description: The session is unknown or its encounter is soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request body or path parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: >-
            The session ended but its signal could not be published. The
            encounter is already `completed`; retrying will not re-send the
            signal, so replaying it is an operator action.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sessions/{session_id}/token:
    post:
      tags: [sessions]
      operationId: remintSessionToken
      summary: Re-mint a session token
      description: >-
        Mints a fresh JWT for a session already under way, carrying the **same**
        `session_id`, the encounter's existing `provider_id`, and a new `exp`.
        Creates no row, mutates none, and publishes nothing. Returns 200 rather
        than 201 — nothing is created, which is the distinction from
        `/sessions/start`.


        A visit routinely outlasts the 15-minute `SESSION_TTL_SECONDS`. Because
        every real-time endpoint validates the token only during the handshake,
        an already-open socket is unaffected; this endpoint exists for the case
        where a *new* socket has to be opened after `exp` — a reconnect, or the
        nudge socket opening later than the audio socket. Calling
        `POST /sessions/start` again instead would fork one visit into two
        encounters, silently.


        Authorisation is the session's own token in an `Authorization: Bearer`
        header, expired or not, accepted while it is no more than
        `SESSION_REMINT_GRACE_SECONDS` past its `exp`. The token must carry the
        same `session_id` as the path. Note that re-minting revokes nothing: with
        no `jti` and no server-side token store, every token issued for this
        session inside that window remains equally acceptable, including one a
        later re-mint superseded. Ending the encounter is the only revocation
        available today. Tracked as issue #51.
      parameters:
        - name: session_id
          in: path
          required: true
          description: The `session_id` whose token is being refreshed.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The same session's id and a freshly minted JWT.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RemintTokenResponse'
        '401':
          description: >-
            No session token was presented, or the one presented is invalid, is
            for a different session, or expired longer ago than the grace window
            allows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: The session is unknown or its encounter is soft-deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            The encounter is already completed. A finished visit cannot obtain a
            token, because that token could reopen its audio socket.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The request body or path parameter is invalid.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notes/{session_id}:
    get:
      tags: [notes]
      operationId: readNote
      summary: Read a session's SOAP note
      description: >-
        Returns the note TASK-030's consumer generated from the encounter's
        transcript: the four SOAP sections, the extracted ICD-10 and CPT codes,
        and the review flags. This is what TASK-071's review screen loads.


        Keyed on `session_id`, the only identifier a client is given —
        `POST /sessions/start` returns `{session_id, jwt}` and nothing here
        exposes the encounter's primary key.


        `icd10_codes` and `cpt_codes` are `null` when the extraction pass never
        answered and `[]` when it ran and found nothing. Those are different
        facts and the distinction reaches the client intact; do not render the
        first as "no diagnoses".


        **This read never sets `reviewed_by_provider`.** That column records a
        provider's attestation, and flipping it on a page load would make it
        indistinguishable from one afterwards. Send the field to `PATCH` to mark
        a note reviewed.


        Unauthenticated in v1, matching the strength of `POST /sessions/start`,
        which takes `provider_id` as an unauthenticated body field. The audit
        actor is the provider on the `encounters` row. Every field returned is
        PHI, and the access is recorded as `READ_NOTE`.
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session whose note is being read.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The generated note, its extracted codes and its review flags.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '404':
          description: >-
            Either the session is unknown or soft-deleted (`session_not_found`),
            or it exists but no note has been generated for it yet
            (`note_not_generated`). The second is the ordinary state for a few
            seconds after a visit ends, while the Sonnet call is still running,
            and a review screen has to be able to tell a provider which of the
            two happened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The path parameter is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [notes]
      operationId: updateNote
      summary: Edit a session's SOAP note
      description: >-
        Applies a provider's edits. A partial update — send only the fields being
        changed.


        **An omitted field is left alone; a field explicitly set to `null` is
        cleared.** Those are two different requests and the handler keeps them
        apart, which matters most on the code lists: a client that sends
        `icd10_codes: []` because it did not think to omit the field has declared
        that the encounter has no diagnoses.


        `provider_edited` is set by the server when a content field actually
        changes, and is not a field a client may send. `reviewed_by_provider` is
        the opposite — a provider's attestation, set only by being sent
        explicitly. Marking a note reviewed without changing anything leaves
        `provider_edited` false.


        A `comprehend-medical` code re-sent with `source: "provider-accepted"`
        becomes documentation, which is how a machine suggestion turns into a
        diagnosis a prior-auth bundle may claim. Such an entry carries no
        `confidence` and no `validation`: a human acceptance is a fact, not a
        probability, and nothing independent remains to validate a provider's own
        documentation against.


        Unauthenticated in v1, as the read is. Recorded as `UPDATE_NOTE`,
        including when the edit changed nothing — the row was still opened.
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session whose note is being edited.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateNoteRequest'
      responses:
        '200':
          description: The note as it stands after the edit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteResponse'
        '404':
          description: >-
            Either the session is unknown or soft-deleted (`session_not_found`),
            or it exists but no note has been generated for it yet
            (`note_not_generated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            The body is invalid — an unknown field, a body that sets no fields at
            all, or a code entry whose `source` and `confidence` contradict each
            other.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /notes/{session_id}/ehr-reference:
    get:
      tags: [notes]
      operationId: readNoteEhrReference
      summary: Read a note's EHR linkage
      description: >-
        Returns the join between this note and the EHR's record of the same
        visit: which chart entry it is (`ehr_encounter_id`), who the document
        would be about (`patient_fhir_id`), and whether a document has already
        been filed (`ehr_document_ref_id`).


        **Server-to-server.** Its caller is `fhir-integration`'s note write-back
        (TASK-053), which cannot answer either identifier for itself. It is a
        sub-resource rather than fields on `GET /notes/{session_id}` because that
        response is what a provider's browser reads, and widening it would put
        encounter identifiers into every browser read to serve one service.


        A null `ehr_encounter_id` is an ordinary answer rather than an error: the
        visit was started outside a SMART launch, so there is no chart entry to
        file against. The caller refuses at that point rather than addressing a
        guessed encounter.


        Unauthenticated in v1, as the note routes are. It returns a patient
        identifier, so it is PHI and is recorded as `READ_ENCOUNTER` against the
        row that holds both identifiers.
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session whose note linkage is being read.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: The identifiers a write-back needs, and whether one has happened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteEhrReferenceResponse'
        '404':
          description: >-
            Either the session is unknown or soft-deleted (`session_not_found`),
            or it exists but no note has been generated for it yet
            (`note_not_generated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The path parameter is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags: [notes]
      operationId: recordNoteEhrReference
      summary: Record the EHR document a write-back created
      description: >-
        Records the `DocumentReference` id an EHR assigned to this note, and is
        the only writer of `clinical_notes.ehr_document_ref_id`.
        `PATCH /notes/{session_id}` still forbids that field: a provider's
        browser must not be able to claim a note was filed to a chart. This route
        is called by `fhir-integration` after it has actually created the
        document.


        **Write-once.** A note that already carries a document id answers 409
        rather than recording a second — two `DocumentReference` resources for
        one encounter is duplicate clinical documentation, which is a clinician
        reading one version while another is amended. The guard is the update's
        own `WHERE` clause rather than a read before it, so two concurrent
        write-backs cannot both succeed.


        The body names the transition explicitly rather than relying on an empty
        PATCH. Unauthenticated in v1, as the note routes are; the actor is the
        provider on the `encounters` row, never the calling service. Recorded as
        `WRITE_NOTE_TO_EHR` — deliberately not `WRITE_NOTE`, which means the note
        was generated and stored here.
      parameters:
        - name: session_id
          in: path
          required: true
          description: The session whose note was filed to the EHR.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordEhrReferenceRequest'
      responses:
        '200':
          description: The note's EHR linkage, now carrying the document id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NoteEhrReferenceResponse'
        '404':
          description: >-
            Either the session is unknown or soft-deleted (`session_not_found`),
            or it exists but no note has been generated for it yet
            (`note_not_generated`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            This note has already been filed to the EHR
            (`note_already_written_to_ehr`). Refused rather than recorded twice:
            two documents for one encounter is a duplicate entry on a patient's
            chart.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            The body is invalid — an unknown field, or a missing or empty
            `ehr_document_ref_id`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /prior-auth/{request_id}:
    get:
      tags: [prior-auth]
      operationId: readPriorAuthRequest
      summary: Read a prior-authorization request for submission
      description: >-
        Returns what a payer submission is built from — the procedures being
        requested, the diagnoses justifying them, the clinical evidence offered
        against the payer's criteria, the payer's own name and the member id, and
        the two EHR identifiers that say who and which visit — plus whether this
        request has already been submitted.


        **Server-to-server.** Its caller is `fhir-integration`'s prior-auth
        submission (TASK-054), which holds the EHR credential and the adapter
        that speaks Da Vinci PAS but does not open this service's database. The
        read happening over HTTP is what produces the `READ_PRIOR_AUTH` audit
        row; a direct connection from that service would produce none.


        **Keyed on the request's own primary key** rather than on a session: one
        encounter can carry several prior-authorization requests, so a
        `session_id` would not name one.


        A null `ehr_encounter_id` is an ordinary answer rather than an error: the
        visit was started outside a SMART launch. The caller decides what to do
        about it.


        Unauthenticated in v1, as the note routes are. It returns transcript
        excerpts and a patient identifier, so it is PHI and is recorded as
        `READ_PRIOR_AUTH` against the request.
      parameters:
        - name: request_id
          in: path
          required: true
          description: The prior-authorization request being read.
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: What a payer submission is built from, and whether one has happened.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorAuthRequestResponse'
        '404':
          description: >-
            No such prior-authorization request, or its encounter has been
            soft-deleted (`prior_auth_request_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: The path parameter is not a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /prior-auth/{request_id}/submission:
    patch:
      tags: [prior-auth]
      operationId: recordPriorAuthSubmission
      summary: Record a submission and what the payer said
      description: >-
        Records that this request was transmitted to a payer and what came back.
        The only writer of `submission_method`, `payer_outcome` and
        `payer_reference_number`. Called by `fhir-integration` once a payer has
        actually answered, which is what makes the values trustworthy.


        **The payer's answer is recorded even when it is a refusal.** An `error`
        outcome leaves `status` at `error` rather than `submitted`: nothing is
        pending with the payer, and recording it as submitted would leave someone
        waiting for a decision on a request that was never taken in. A `queued`
        answer usually carries no `payer_reference_number` at all — that field is
        0..1 in the PAS response and its absence is not a failure.


        **Write-once.** A request already submitted answers 409 rather than
        recording a second: a payer that receives one request twice may open two
        reviews, and only one reference number can be kept here. The guard is the
        update's own `WHERE` clause rather than a read before it, so two
        concurrent submissions cannot both be recorded.


        The body names the transition explicitly rather than relying on an empty
        PATCH. Unauthenticated in v1; the actor is the provider on the
        `encounters` row, never the calling service. Recorded as
        `SUBMIT_PRIOR_AUTH` — the same action the submitting service writes, with
        `service_name` telling the two rows apart.
      parameters:
        - name: request_id
          in: path
          required: true
          description: The prior-authorization request that was submitted.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecordSubmissionRequest'
      responses:
        '200':
          description: The request, now carrying the payer's answer.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PriorAuthRequestResponse'
        '404':
          description: >-
            No such prior-authorization request, or its encounter has been
            soft-deleted (`prior_auth_request_not_found`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: >-
            This request has already been submitted
            (`prior_auth_already_submitted`). Refused rather than recorded twice.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: >-
            The body is invalid — an unknown field, a missing `outcome`, or a
            `submission_method` or `outcome` outside its vocabulary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    SubmissionMethod:
      type: string
      description: >-
        Which path a prior authorization left this system by. Closed, unlike
        `status`: a status is where a request has got to and may need a
        payer-specific value, while a method is our own word for which code path
        sent it.
      enum: [fhir-pas, covermymeds, fax]

    SubmissionOutcome:
      type: string
      description: >-
        What the payer said, normalized across both submission paths. The members
        are `ClaimResponse.outcome`'s required binding in the Da Vinci PAS IG,
        because that is a real four-way distinction; CoverMyMeds is not FHIR and
        maps onto the same shape. `complete` means the payer adjudicated the
        request and says nothing about which way.
      enum: [complete, queued, partial, error]

    PriorAuthRequestData:
      type: object
      description: >-
        One prior-authorization request as its submitter needs it, joined to the
        encounter that holds the EHR identifiers and payer columns.
      required:
        - request_id
        - session_id
        - status
        - payer_outcome
        - patient_fhir_id
        - ehr_encounter_id
        - payer_name
        - insurance_plan_type
        - insurance_member_id
        - procedures
        - diagnoses
        - clinical_evidence
        - submission_method
        - payer_reference_number
        - submitted_at
      properties:
        request_id:
          type: string
          format: uuid
          description: Echoed so a caller with several submissions in flight cannot mismatch one.
        session_id:
          type: string
          format: uuid
          description: The encounter session this request came out of.
        status:
          type: string
          description: >-
            Where the request has got to in our own process — `pending`,
            `submitted`, `error`, `approved` or `denied`. Free text rather than a
            closed set so a payer-specific state needs no migration.
        payer_outcome:
          $ref: '#/components/schemas/SubmissionOutcome'
          nullable: true
          description: >-
            What the payer said, once it has been asked. Null before submission,
            and a different fact from `status`.
        patient_fhir_id:
          type: string
          description: The patient as the EHR knows them.
        ehr_encounter_id:
          type: string
          nullable: true
          description: >-
            The encounter as the EHR knows it. Null when the visit was started
            outside a SMART launch, which is an ordinary state rather than an error.
        payer_name:
          type: string
          nullable: true
          description: >-
            The payer's own display name, from the request row or else the
            encounter's coverage columns. Never a `payer_vocab` slug — a slug
            matches our indexed policies, and this value goes to the payer.
        insurance_plan_type:
          type: string
          nullable: true
          description: The plan type as the coverage spelled it.
        insurance_member_id:
          type: string
          nullable: true
          description: The member id the payer matches the request on.
        procedures:
          type: array
          nullable: true
          items:
            type: object
          description: >-
            What is being requested, as stored by the assembly (TASK-060). Passed
            through rather than reshaped here: the submitter's builder is where a
            shape is actually required.
        diagnoses:
          type: array
          nullable: true
          items:
            type: object
          description: >-
            The diagnoses justifying the request, as stored. Each carries a
            `source`, which decides whether it may leave this system — the filter
            is applied in the submitter's builder.
        clinical_evidence:
          type: array
          nullable: true
          items:
            type: object
          description: >-
            The documentation offered against the payer's criteria. Transcript
            excerpts, and the most sensitive thing this payload carries.
        submission_method:
          $ref: '#/components/schemas/SubmissionMethod'
          nullable: true
          description: How it went out, or null before it has.
        payer_reference_number:
          type: string
          nullable: true
          description: The payer's reference for the submission, when it gave one.
        submitted_at:
          type: string
          format: date-time
          nullable: true
          description: >-
            When it was transmitted, or null. Non-null is what makes a repeat
            submission refusable before a payer is ever called.

    PriorAuthRequestResponse:
      type: object
      description: The standard envelope, carrying one prior-authorization request.
      required: [data, error]
      properties:
        data:
          $ref: '#/components/schemas/PriorAuthRequestData'
          nullable: true
        error:
          $ref: '#/components/schemas/Error'
          nullable: true

    RecordSubmissionRequest:
      type: object
      description: >-
        Names the transition being recorded. The only way `submission_method`,
        `payer_outcome` and `payer_reference_number` are ever set.
      additionalProperties: false
      required: [submission_method, outcome]
      properties:
        submission_method:
          $ref: '#/components/schemas/SubmissionMethod'
        outcome:
          $ref: '#/components/schemas/SubmissionOutcome'
        payer_reference_number:
          type: string
          nullable: true
          minLength: 1
          maxLength: 200
          description: >-
            The payer's reference, when it gave one. Optional because
            `ClaimResponse.preAuthRef` is 0..1 and is legitimately absent on a
            queued answer.

    ComponentStatus:
      type: string
      enum: [ok, error]

    HealthData:
      type: object
      required: [redis, transcript_consumer]
      properties:
        redis:
          $ref: '#/components/schemas/ComponentStatus'
          description: >-
            Whether Redis answers. This service both publishes the session
            lifecycle signals and consumes the transcript bus over it, so an
            unreachable Redis means new sessions cannot be announced and no
            transcript is accumulated.
        transcript_consumer:
          $ref: '#/components/schemas/ComponentStatus'
          description: >-
            Whether the transcript consumer is running and subscribed. When it
            is not, no encounter on this instance accumulates a transcript and
            none produces a SOAP note — a failure that otherwise surfaces only
            as TASK-060 exhausting its retries, one warning per visit. The one
            consumer serves the announcement, transcript and end channels
            together, so there is no separate flag for the end signal: two
            flags that cannot disagree would imply coverage that does not exist.

    HealthResponse:
      type: object
      description: The standard envelope, carrying health flags.
      required: [data, error]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/HealthData'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'

    StartSessionRequest:
      type: object
      additionalProperties: false
      required: [patient_id, provider_id]
      properties:
        patient_id:
          type: string
          minLength: 1
          maxLength: 100
          description: >-
            The patient's FHIR resource id. Stored as `encounters.patient_fhir_id`
            — the wire name and the column name differ deliberately.
          examples: ['synthea-placeholder-1']
        provider_id:
          type: string
          format: uuid
          description: The provider starting the visit.
        ehr_encounter_id:
          type: [string, 'null']
          maxLength: 100
          default: null
          description: The EHR's own Encounter resource id, when launched from one.
          examples: ['athena-enc-9001']
        launch_id:
          type: [string, 'null']
          maxLength: 64
          default: null
          description: >-
            The SMART launch this visit was started from, as returned by
            `GET /fhir/callback` on fhir-integration. Supplied together with
            `ehr_encounter_id`, it lets the service read the encounter's payer,
            plan type and site-of-care state from the EHR and record them on the
            encounter (TASK-052b); either one alone leaves those columns null,
            and so does a lookup that fails — the session still starts.

            Not a `session_id`, and not interchangeable with one. A SMART launch
            and an encounter session are different identifiers with different
            lifetimes, and the session this call is about does not exist until
            it answers.
          examples: ['3f2a7c18-0d64-4a51-9f0e-8b1c2d3e4f50']

    StartSessionData:
      type: object
      required: [session_id, jwt]
      properties:
        session_id:
          type: string
          format: uuid
        jwt:
          type: string
          description: >-
            HS256, signed with `JWT_SIGNING_KEY`. Claims are exactly
            `{session_id, provider_id, exp}` — no `iss` or `aud` in v1. Expires
            after `SESSION_TTL_SECONDS` (900 by default).

    EndSessionData:
      type: object
      required: [session_id, status, ended_at, already_ended]
      properties:
        session_id:
          type: string
          format: uuid
        status:
          type: string
          enum: [completed]
        ended_at:
          type: string
          format: date-time
          description: ISO 8601 UTC, written by the database as `NOW()`.
        already_ended:
          type: boolean
          description: True when this call was a no-op repeat and published no signal.

    RemintTokenData:
      type: object
      required: [session_id, jwt]
      description: >-
        Structurally identical to `StartSessionData`, and named separately on
        purpose: a re-mint response should not be described by a schema whose
        name says a session was started, when starting nothing is the point.
      properties:
        session_id:
          type: string
          format: uuid
          description: >-
            Echoed back, and always the session that was asked for — never a new
            one. A client can assert on it to catch a fork.
        jwt:
          type: string
          description: >-
            Same claim set and signing as `/sessions/start` issues — exactly
            `{session_id, provider_id, exp}`, HS256 under `JWT_SIGNING_KEY`. Only
            `exp` differs from the token it replaces.

    CodeValidation:
      type: object
      additionalProperties: false
      required: [confirmed]
      description: What TASK-031's Comprehend Medical pass found for one proposed code.
      properties:
        source:
          type: string
          enum: [comprehend-medical]
          default: comprehend-medical
        confidence:
          type: [number, 'null']
          minimum: 0.0
          maximum: 1.0
          default: null
          description: >-
            Comprehend's `ICD10CMConcept.Score` for the matching code — the
            concept score, not the entity score — or `null` when it returned no
            such concept at all.
        confirmed:
          type: boolean

    ExtractedCode:
      type: object
      additionalProperties: false
      required: [code, source]
      description: >-
        One ICD-10-CM or CPT code, with where it came from and what confirmed it.
        The contract is fixed in CLAUDE.md, "Extracted clinical codes — one JSON
        shape".
      properties:
        code:
          type: string
          minLength: 1
          description: >-
            ICD-10-CM stored dotted (`M17.11`), CPT as five characters (`73721`).
            Normalised on write, so comparison elsewhere is plain equality.
          examples: ['M17.11']
        display:
          type: [string, 'null']
          default: null
          description: The source's own description, never one invented to fill the field.
        source:
          type: string
          enum: [llm-extraction, comprehend-medical, provider-accepted]
          description: >-
            Which pass proposed the code, or that a provider did.
            `comprehend-medical` is a suggestion rather than a stated diagnosis;
            `provider-accepted` is one a provider deliberately documented through
            this endpoint, and is the only value a human writes.
        confidence:
          type: [number, 'null']
          minimum: 0.0
          maximum: 1.0
          default: null
          description: >-
            The proposing source's own score. Always `null` for `llm-extraction`
            (a model's self-rating is not a measurement) and for
            `provider-accepted` (a human acceptance is not a probability); both
            are rejected rather than ignored.
        validation:
          oneOf:
            - $ref: '#/components/schemas/CodeValidation'
            - type: 'null'
          default: null
          description: >-
            `null` means "not checked yet", never "checked and rejected". Stays
            `null` permanently on CPT entries, on `comprehend-medical` entries
            and on `provider-accepted` entries.

    NoteData:
      type: object
      required:
        - session_id
        - note_id
        - soap_subjective
        - soap_objective
        - soap_assessment
        - soap_plan
        - icd10_codes
        - cpt_codes
        - generated_at
        - reviewed_by_provider
        - provider_edited
        - ehr_document_ref_id
      properties:
        session_id:
          type: string
          format: uuid
        note_id:
          type: string
          format: uuid
          description: >-
            The `clinical_notes` row id. Included because it is what the audit
            trail records, so a provider reporting a problem can name the row.
        soap_subjective:
          type: [string, 'null']
        soap_objective:
          type: [string, 'null']
        soap_assessment:
          type: [string, 'null']
        soap_plan:
          type: [string, 'null']
        icd10_codes:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ExtractedCode'
            - type: 'null'
          description: >-
            `null` when the extraction pass never answered, `[]` when it ran and
            found nothing.
        cpt_codes:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ExtractedCode'
            - type: 'null'
          description: >-
            Same null/empty distinction as `icd10_codes`. These entries keep
            `validation: null` indefinitely — Comprehend Medical has no CPT
            inference to check them against.
        generated_at:
          type: string
          format: date-time
          description: ISO 8601 UTC, when the note was generated.
        reviewed_by_provider:
          type: boolean
          description: >-
            Set only by an explicit `reviewed_by_provider` in a PATCH body. A
            read never sets it.
        provider_edited:
          type: boolean
          description: >-
            Set by the server when a PATCH actually changes a content field.
            Never cleared: a note that was edited stays edited.
        ehr_document_ref_id:
          type: [string, 'null']
          description: >-
            The DocumentReference id from EHR write-back (TASK-053). Null until
            write-back succeeds.

    UpdateNoteRequest:
      type: object
      additionalProperties: false
      description: >-
        A partial edit. Every field is optional and **an omitted field is not the
        same as a null one** — omitting leaves the column alone, sending `null`
        clears it. At least one field must be set; an empty body is rejected.
      properties:
        soap_subjective:
          type: [string, 'null']
          default: null
        soap_objective:
          type: [string, 'null']
          default: null
        soap_assessment:
          type: [string, 'null']
          default: null
        soap_plan:
          type: [string, 'null']
          default: null
        icd10_codes:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ExtractedCode'
            - type: 'null'
          default: null
          description: >-
            Send the whole list, not a diff. Omit it entirely when the codes were
            not touched — sending `[]` declares the encounter has no diagnoses.
        cpt_codes:
          oneOf:
            - type: array
              items:
                $ref: '#/components/schemas/ExtractedCode'
            - type: 'null'
          default: null
        reviewed_by_provider:
          type: [boolean, 'null']
          default: null
          description: >-
            The provider's attestation that they have reviewed the note. Setting
            it alone does not set `provider_edited`.

    NoteEhrReferenceData:
      type: object
      description: >-
        The join between this note and the EHR's record of the same visit. A
        sub-resource of the note, served to the write-back rather than to a
        browser.
      required: [session_id, ehr_encounter_id, patient_fhir_id, ehr_document_ref_id]
      properties:
        session_id:
          type: string
          format: uuid
          description: >-
            Echoed so a caller holding several write-backs in flight cannot
            mismatch a response to a request.
        ehr_encounter_id:
          type: string
          nullable: true
          description: >-
            The encounter as the EHR knows it. Null when the visit was started
            outside a SMART launch, which is an ordinary state rather than an
            error — there is simply no chart entry to file a note against.
        patient_fhir_id:
          type: string
          description: >-
            The patient as the EHR knows them — the subject of any
            `DocumentReference` written for this note.
        ehr_document_ref_id:
          type: string
          nullable: true
          description: >-
            The document already filed for this note, or null when none has been.
            Non-null is what makes a second write-back a 409.

    NoteEhrReferenceResponse:
      type: object
      description: The standard envelope, carrying a note's EHR linkage.
      required: [data, error]
      properties:
        data:
          $ref: '#/components/schemas/NoteEhrReferenceData'
          nullable: true
        error:
          $ref: '#/components/schemas/Error'
          nullable: true

    RecordEhrReferenceRequest:
      type: object
      description: >-
        Names the transition being recorded. The only way
        `clinical_notes.ehr_document_ref_id` is ever set.
      additionalProperties: false
      required: [ehr_document_ref_id]
      properties:
        ehr_document_ref_id:
          type: string
          minLength: 1
          maxLength: 100
          description: The id of the `DocumentReference` the EHR created.

    NoteResponse:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: '#/components/schemas/NoteData'
        error:
          type: 'null'

    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - session_not_found
            - note_not_generated
            - prior_auth_request_not_found
            - prior_auth_already_submitted
            - signal_not_published
            - auth_rejected
            - session_completed
            - validation_error
            - http_error
        message:
          type: string
          description: >-
            Human-readable and PHI-free. A rejected request body is described by
            field location only; its values are never echoed back.

    StartSessionResponse:
      type: object
      required: [data, error]
      description: The standard envelope from CLAUDE.md's API Design section.
      properties:
        data:
          $ref: '#/components/schemas/StartSessionData'
        error:
          type: 'null'

    EndSessionResponse:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: '#/components/schemas/EndSessionData'
        error:
          type: 'null'

    RemintTokenResponse:
      type: object
      required: [data, error]
      properties:
        data:
          $ref: '#/components/schemas/RemintTokenData'
        error:
          type: 'null'

    ErrorResponse:
      type: object
      required: [data, error]
      properties:
        data:
          type: 'null'
        error:
          $ref: '#/components/schemas/Error'
