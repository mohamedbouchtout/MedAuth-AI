openapi: 3.1.0

# The published contract for services/nudge-service.
#
# Kept in step with the FastAPI app by
# services/nudge-service/tests/unit/api/test_openapi_contract.py, which fails if
# a route, method or status code here drifts from the application. Update this
# file in the same change that adds or alters a route.
#
# NOTE: this service's principal surface is a WebSocket, and OpenAPI 3.1 has no
# way to describe one — there is no `websocket:` operation and no place to put a
# close code. It is documented in prose under `x-websocket-endpoints` below,
# which is an extension field rather than something a generator understands.
# The drift test therefore covers `/health` only; what keeps the WebSockets
# honest is tests/unit/api/test_websocket.py and
# tests/unit/api/test_transcript_websocket.py. The contract test does check that
# every endpoint documented below is one the app actually serves, and that every
# served one is documented - in both directions, so neither a stale entry nor a
# missing one passes.

info:
  title: MedAuth AI — nudge-service
  version: 0.1.0
  description: >-
    Relays one encounter's live streams from the Redis bus to connected clients:
    clinical nudges (TASK-041) and transcript segments (TASK-041d). A publisher
    writes to the channel - track-b-rag for nudges (TASK-040), audio-ingestion
    for transcripts (TASK-020) - and this service subscribes on behalf of one
    client and forwards each message unaltered to the web (TASK-042, TASK-070)
    and mobile (TASK-043) apps. It parses no payload and holds no database
    connection.

servers:
  - url: http://localhost:8005
    description: Local development (see the port table in CLAUDE.md)

tags:
  - name: health
    description: Readiness of this service's backing dependencies.
  - name: streams
    description: The live streams for one encounter - nudges and transcript.

x-websocket-endpoints:
  /ws/nudges/{session_id}:
    summary: One encounter's clinical nudges, relayed live from the Redis bus.
    description: >-
      Server to client only. Each message is the nudge payload published by
      track-b-rag, forwarded as the exact string it was published as — this
      service never parses, reshapes, filters or enriches it. The payload's
      shape is fixed in CLAUDE.md, "The nudge payload — one shape", which has
      one writer and four readers; a relay that edited it would be a second
      definition of it, free to drift from the one that writes it. Note that
      `cpt_code` is nullable there, because TASK-044 emits nudges for a
      procedure that resolved no code.

      Frames sent by the client are read only to notice the disconnect and are
      otherwise discarded. Nothing travels in that direction, and closing the
      socket because a client sent a keepalive would be hostile — deliberately
      unlike the audio socket, where an unexpected frame type means a broken
      client and closes with 1003.
    authentication: >-
      A session JWT minted by track-a-clinical's `POST /sessions/start`
      (TASK-006), carried in EITHER the `Authorization: Bearer <jwt>` header OR
      as a `medauth.jwt.<jwt>` entry in `Sec-WebSocket-Protocol` alongside
      `medauth.session.v1`. Either carrier is sufficient. The subprotocol form
      exists because a browser cannot set a header on the native `WebSocket`
      constructor, which apps/web is required to use. The server echoes
      `medauth.session.v1` and never the token entry. See CLAUDE.md, "How the
      JWT reaches a WebSocket endpoint"; the validation is shared with the
      audio socket through packages/session-auth rather than reimplemented.
    validation: >-
      Signature against `JWT_SIGNING_KEY`, `exp` in the future, and the token's
      `session_id` claim equal to the path parameter. Checked before the
      handshake is accepted; no Redis subscription is opened for a token that
      fails. The session id the service subscribes to comes from the validated
      token, so a client can only ever watch the encounter its token names.
    close-codes:
      4401: >-
        The session token is missing, malformed, expired, signed with another
        key, or was minted for a different session. Because the refusal happens
        before the handshake completes, a browser observes a failed upgrade
        rather than an onclose carrying this code.
      1011: The Redis subscription failed after the handshake was accepted.
    audit: >-
      One `RELAY_NUDGES` row per accepted connection, written before any nudge
      is relayed. A refused connection writes none — no PHI was reached.
      `actor_id` is the `provider_id` claim from the validated token; this
      service reads no tables.
  /ws/transcript/{session_id}:
    summary: One encounter's transcript segments, relayed live from the Redis bus.
    description: >-
      Server to client only, on exactly the same terms as the nudge stream above
      (TASK-041d). Each message is the segment payload published by
      audio-ingestion to `transcription:{session_id}` (TASK-020), forwarded as
      the exact string it was published as — this service never parses,
      reshapes, filters or enriches it. The payload's shape is fixed in
      CLAUDE.md, "The transcript segment payload — one shape", which has one
      writer and several readers including one in TypeScript; a relay that
      edited it would be a second definition of it, free to drift from the one
      that writes it.

      `is_partial` is always false on this channel: audio-ingestion drops
      partial results before they reach the bus, so one message arrives per
      stabilized utterance rather than several per sentence. The field still
      travels, and a reader must not drop it or assume its value — it is what
      lets a later task widen the publisher without changing this contract.

      Frames sent by the client are read only to notice the disconnect and are
      otherwise discarded, deliberately unlike the audio socket, where an
      unexpected frame type means a broken client and closes with 1003.
    history: >-
      **A client sees only what is said after it connects.** Redis pub/sub keeps
      no history, so a socket opened late in a visit, or reopened after a drop,
      starts from silence, and the earlier segments are not recoverable from
      this service — the accumulated transcript lives in track-a-clinical's
      in-memory buffer (TASK-030) and no route exposes it. A client must
      therefore not present what it received as a complete transcript, and must
      render "connected, nothing said yet" differently from "not connected": an
      empty transcript that reads as "nobody is speaking" is the one thing this
      stream must not be mistaken for. Replaying the buffer on connect is
      deliberately out of scope for TASK-041d.
    authentication: >-
      Identical to the nudge stream above, through the same
      packages/session-auth validation — both carriers, either sufficient, and
      the server echoes `medauth.session.v1` and never the token entry.
    validation: >-
      Identical to the nudge stream above: signature against `JWT_SIGNING_KEY`,
      `exp` in the future, and the token's `session_id` claim equal to the path
      parameter, all checked before the handshake is accepted. The session id
      subscribed to comes from the validated token, so a client can only ever
      watch the encounter its token names — never a pattern across the channel
      family that carries speech.
    close-codes:
      4401: >-
        The session token is missing, malformed, expired, signed with another
        key, or was minted for a different session; or the `Origin` is not in
        `CORS_ALLOWED_ORIGINS`. Because the refusal happens before the handshake
        completes, a browser observes a failed upgrade rather than an onclose
        carrying this code.
      1011: The Redis subscription failed after the handshake was accepted.
    audit: >-
      One `RELAY_TRANSCRIPT` row per accepted connection, written before any
      segment is relayed, and never one per segment — an encounter is hundreds.
      A refused connection writes none. Deliberately a different action from
      `RELAY_NUDGES`: speech and alerts are different disclosures, and one
      action for both would make "was this encounter's speech ever streamed to a
      client" unanswerable from the audit trail.

paths:
  /health:
    get:
      tags: [health]
      operationId: health
      summary: Service health
      description: >-
        Reports whether the Redis bus this service subscribes to is reachable.
        200 when it answers, 503 when it does not. The body is the standard
        envelope in both cases — a 503 carries `data`, not `error`, because the
        request itself succeeded and the flags are the only diagnostic the
        endpoint has.

        The flag is fatal rather than advisory: a relay that cannot reach the
        bus delivers nothing, and a provider cannot tell a visit with no alerts
        from a visit with nothing to flag.

        Unauthenticated and deliberately unaudited: this is what the Kubernetes
        readiness probe calls, it exposes no patient data, and CLAUDE.md exempts
        health endpoints from the hipaa-logger requirement.
      responses:
        '200':
          description: Readiness of the Redis bus nudges are relayed from.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          description: At least one dependency is unreachable. The body names which.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

components:
  schemas:
    ComponentStatus:
      type: string
      enum: [ok, error]

    HealthData:
      type: object
      required: [redis]
      properties:
        redis:
          $ref: '#/components/schemas/ComponentStatus'
          description: >-
            Whether the Redis bus that nudges are subscribed on answers. Fatal
            rather than advisory here: there is no degraded mode, and a nudge
            this service cannot receive is one the provider never sees.

    HealthResponse:
      type: object
      description: The standard envelope, carrying health flags.
      required: [data, error]
      properties:
        data:
          oneOf:
            - $ref: '#/components/schemas/HealthData'
            - type: 'null'
        error:
          oneOf:
            - $ref: '#/components/schemas/Error'
            - type: 'null'

    Error:
      type: object
      description: >-
        The error half of the envelope. Health never populates it; the shared
        error handlers do, for routes that fail.
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - validation_error
            - http_error
        message:
          type: string
