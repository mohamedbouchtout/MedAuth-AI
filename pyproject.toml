# MedAuth AI — uv workspace root.
#
# This is a virtual root: it defines no package of its own, it only ties the
# workspace members together and holds shared tool configuration.
# Every Python service and shared package is a workspace member.
#
# Install everything:      uv sync --all-packages
# Run one service:         cd services/track-b-rag && uv run uvicorn track_b_rag.main:app --reload --port 8002

[tool.uv.workspace]
members = ["services/*", "packages/*"]
# packages/audio-wire is TypeScript only — it is an npm workspace member, not a
# uv one, and has no pyproject.toml. Without this exclusion the `packages/*`
# glob claims it and `uv sync` fails outright for every Python job. Any future
# TypeScript-only package under packages/ needs a line here too.
exclude = ["packages/audio-wire", "packages/session-client"]

[tool.uv.sources]
medauth-api-envelope = { workspace = true }
medauth-bedrock-client = { workspace = true }
medauth-hipaa-logger = { workspace = true }
medauth-cors-policy = { workspace = true }
medauth-crypto-utils = { workspace = true }
medauth-fhir-types = { workspace = true }
medauth-payer-vocab = { workspace = true }
medauth-session-auth = { workspace = true }
# Services are workspace members too. track-b-rag depends on track-a-clinical
# for the shared SQLAlchemy models (see CLAUDE.md, "Where the shared SQLAlchemy
# models live") — the only service-to-service dependency so far.
medauth-track-a-clinical = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.24",
    "pytest-cov>=7.1.0",
    "httpx>=0.28",
    "moto[all]>=5.2.2",
    # Reads the committed OpenAPI spec in the docs/api drift test.
    "pyyaml>=6.0",
    "ruff>=0.16.4",
    "mypy>=2.3.0",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "T20"]  # T20 bans print() — see CLAUDE.md conventions

[tool.ruff.lint.isort]
# Workspace packages are installed from source, so isort would otherwise sort them
# in with third-party imports.
known-first-party = [
    "api_envelope",
    "bedrock_client",
    "cors_policy",
    "hipaa_logger",
    "crypto_utils",
    "fhir_types",
    "payer_vocab",
    "session_auth",
    "policy_scraper",
    "track_a_clinical",
    "track_b_rag",
    "src",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: requires a real backing service (PostgreSQL, Redis, Qdrant); skipped without one",
]

[tool.coverage.report]
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true

# asyncpg, alembic, boto3 and botocore do not ship complete type information;
# strict mode would otherwise fail on the import itself rather than on any of our
# own code.
#
# boto3 and botocore moved here in TASK-012, when track-b-rag became the second
# package to call an AWS service and crypto-utils' per-import-site ignores stopped
# being the whole story — its own comment asked for exactly this move. boto3
# builds its clients dynamically, so even the published stub packages describe
# them as generic service objects; track-b-rag confines the resulting Any to one
# factory function rather than spreading it across call sites.
[[tool.mypy.overrides]]
module = ["asyncpg.*", "alembic.*", "boto3.*", "botocore.*"]
ignore_missing_imports = true
